<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 검색엔진에 노출되지 않도록 설정 (링크를 아는 사람만 접근) -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>손지윤 | 레벨/콘텐츠 기획 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --base:#e9edf2;      /* 회청색 바탕 */
    --surface:#ffffff;
    --ink:#152033;       /* 본문 */
    --ink-2:#4a5568;
    --ink-3:#8792a2;
    --grid:#d3dae4;      /* 타일 선 */
    --tile:#dbe3ee;      /* 지형 타일 */
    --cobalt:#2f54eb;    /* 경로, 강조 */
    --goal:#ffc53d;      /* 목표 지점 */
    --navy:#0a3163;      /* 사이드바 */
    --side:280px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;background:var(--base);color:var(--ink);line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--cobalt);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

  /* ===== 사이드바 (기존 유지) ===== */
  aside{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#fff;padding:40px 32px;display:flex;flex-direction:column;z-index:20}
  .id small{font-size:12px;color:#8fa7c9}
  .id h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
  .id p{font-size:14px;color:#c4d1e4}
  .side-nav{margin-top:56px;list-style:none;display:flex;flex-direction:column}
  .side-nav a{display:flex;align-items:baseline;gap:14px;padding:11px 0;color:#8fa7c9;font-weight:600;font-size:15px;transition:color .2s;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-nav a span{font-size:12px;width:20px;font-variant-numeric:tabular-nums}
  .side-nav a:hover,.side-nav a.on{color:#fff}
  .side-nav a.on span{color:var(--goal)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
  .side-foot a.dl{display:flex;justify-content:space-between;padding:12px 14px;border:1px solid rgba(255,255,255,.3);border-radius:6px;font-weight:700;transition:.2s}
  .side-foot a.dl:hover{background:#fff;color:var(--navy)}
  .side-foot .mail{color:#8fa7c9;font-size:12px}

  main{margin-left:var(--side)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 56px}
  section{padding:120px 0}
  .sec-title{font-size:15px;font-weight:700;color:var(--cobalt);margin-bottom:10px}
  .sec-head{font-size:clamp(28px,3vw,38px);font-weight:800;letter-spacing:-.035em;line-height:1.3;margin-bottom:48px;max-width:720px}

  /* 버튼 */
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:8px;font-size:15px;font-weight:700;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
  .btn:hover{background:var(--ink);color:#fff}
  .btn.solid{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
  .btn.solid:hover{background:#1d39b8;border-color:#1d39b8}
  .btn svg{width:17px;height:17px}

  /* ===== 01 소개: 스테이지 맵 ===== */
  #about{min-height:100vh;display:flex;align-items:center;padding:80px 0;
    background-image:linear-gradient(rgba(211,218,228,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(211,218,228,.55) 1px,transparent 1px);
    background-size:40px 40px;background-position:-1px -1px}
  .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:center}
  .role{font-size:17px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .hero h2{font-size:clamp(64px,7.4vw,104px);font-weight:900;letter-spacing:-.06em;line-height:1;margin-bottom:28px}
  .hero .desc{font-size:17px;color:var(--ink-2);max-width:30em;margin-bottom:18px}
  .hero .desc strong{color:var(--ink);font-weight:700}
  .kw{font-size:14px;color:var(--ink-3);margin-bottom:32px}

  .map{background:var(--surface);border-radius:12px;padding:20px;box-shadow:0 1px 0 var(--grid),0 24px 48px -28px rgba(21,32,51,.35)}
  .map svg{display:block;width:100%;height:auto}
  .map figcaption{font-size:13px;color:var(--ink-3);margin-top:12px;display:flex;justify-content:space-between;gap:12px}
  .map .lbl{paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
  .map .route{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.4s .3s cubic-bezier(.6,0,.2,1) forwards}
  .map .node{opacity:0;animation:pop .35s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{to{opacity:1}}

  /* 기획 원칙 */
  #pillars{padding:100px 0 110px;background:var(--surface)}
  .pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink)}
  .pillar{padding:28px 32px 0 0}
  .pillar+.pillar{padding-left:32px;border-left:1px solid var(--grid)}
  .pillar .ico{width:40px;height:40px;margin-bottom:18px}
  .pillar h3{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .pillar .lead{font-size:14px;color:var(--cobalt);font-weight:600;margin-bottom:16px}
  .pillar ul{list-style:none;display:grid;gap:8px}
  .pillar li{font-size:15px;color:var(--ink-2);padding-left:16px;position:relative}
  .pillar li::before{content:"";position:absolute;left:0;top:.72em;width:7px;height:7px;background:var(--grid)}
  .pillar li strong{color:var(--ink);font-weight:700}

  /* ===== 02 이력 ===== */
  .resume{display:grid;grid-template-columns:240px minmax(0,1fr);gap:64px;align-items:start}
  .who{position:sticky;top:40px}
  .who .photo{position:relative;width:100%;aspect-ratio:4/5;margin-bottom:22px}
  .who .photo img{width:100%;height:100%;object-fit:cover;object-position:center 25%;border-radius:4px;display:block}
  .who .photo::before,.who .photo::after{content:"";position:absolute;width:22px;height:22px;border:3px solid var(--cobalt)}
  .who .photo::before{top:-8px;left:-8px;border-right:0;border-bottom:0}
  .who .photo::after{bottom:-8px;right:-8px;border-left:0;border-top:0}
  .who .nm{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .who .en{color:var(--ink-3);font-size:15px;margin-bottom:16px}
  .who dl{font-size:14px;display:grid;grid-template-columns:52px 1fr;gap:4px 10px}
  .who dt{color:var(--ink-3)}

  .rblock{margin-bottom:56px}
  .rblock:last-child{margin-bottom:0}
  .rblock h3{font-size:19px;font-weight:800;padding-bottom:12px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:12px}
  .rblock h3 small{font-size:14px;font-weight:600;color:var(--cobalt)}
  .row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding:16px 0;border-bottom:1px solid var(--grid)}
  .row .w{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .row b{font-size:16px;font-weight:700}
  .row .s{display:block;font-size:14px;color:var(--ink-2)}
  .row ul{list-style:none;margin-top:10px;display:grid;gap:4px}
  .row li{font-size:14px;color:var(--ink-2);padding-left:16px;position:relative}
  .row li::before{content:"";position:absolute;left:0;top:.72em;width:7px;height:7px;background:var(--cobalt)}
  .figures{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .figures div{padding:10px 14px;background:var(--surface);border-radius:6px;border:1px solid var(--grid)}
  .figures b{display:block;font-size:22px;font-weight:800;color:var(--cobalt);letter-spacing:-.02em;line-height:1.2}
  .figures small{font-size:12px;color:var(--ink-2)}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px}
  .two .row{grid-template-columns:56px minmax(0,1fr)}

  /* ===== 03 작업 ===== */
  #works{background:var(--surface)}
  .works-top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
  .works-top .sec-head{margin-bottom:0}
  .seg{display:inline-flex;background:var(--base);border-radius:8px;padding:4px}
  .seg button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(21,32,51,.15)}
  .seg button span{color:var(--ink-3);font-weight:500;margin-left:4px}
  .works{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 28px}
  .work{display:flex;flex-direction:column}
  .work .th{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;margin-bottom:16px;
    background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:24px 24px}
  .work .th img{width:100%;height:100%;object-fit:cover;display:block}
  .work .th .ph{position:absolute;inset:auto 18px 16px 18px;font-size:20px;font-weight:800;color:#fff;line-height:1.3;letter-spacing:-.02em}
  .work .kind{position:absolute;top:14px;left:14px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:4px;background:#fff;color:var(--ink)}
  .work .kind.doc{background:var(--goal)}
  .work .meta{font-size:13px;color:var(--ink-3);margin-bottom:4px}
  .work h3{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.35;margin-bottom:8px}
  .work p{font-size:14px;color:var(--ink-2);margin-bottom:12px;flex:1}
  .work .tags{font-size:13px;color:var(--cobalt);font-weight:600;margin-bottom:14px}
  .work .go{align-self:flex-start;font-size:14px;font-weight:700;padding-bottom:2px;border-bottom:2px solid var(--ink)}
  .work .go:hover{color:var(--cobalt);border-color:var(--cobalt)}
  .work .go.soon{color:var(--ink-3);border-color:var(--grid)}

  /* ===== 04 연락처 ===== */
  #contact{padding-bottom:48px}
  .contact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:end;padding-bottom:64px;border-bottom:2px solid var(--ink)}
  .contact .sec-head{margin-bottom:28px}
  .lines{display:grid;gap:4px}
  .line{display:flex;align-items:baseline;gap:16px;font-size:clamp(22px,2.6vw,32px);font-weight:700;letter-spacing:-.02em}
  .line small{font-size:14px;color:var(--ink-3);font-weight:600;width:56px;flex-shrink:0}
  .line button{font-family:inherit;font-size:13px;font-weight:700;color:var(--cobalt);background:none;border:0;cursor:pointer;padding:4px}
  footer{display:flex;justify-content:space-between;padding-top:20px;font-size:13px;color:var(--ink-3)}

  .toast{position:fixed;left:calc(50% + var(--side)/2);bottom:32px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;font-weight:600;transition:.2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:1180px){
    .hero{grid-template-columns:1fr}
    .works{grid-template-columns:repeat(2,minmax(0,1fr))}
    .resume{grid-template-columns:1fr}
    .who{position:static;display:grid;grid-template-columns:160px 1fr;gap:0 28px;align-items:end}
    .who .photo{margin-bottom:0;grid-row:span 4}
  }
  @media(max-width:960px){
    aside{position:sticky;top:0;inset:auto;width:100%;height:auto;flex-direction:row;align-items:center;padding:12px 20px}
    .id small,.id p,.side-foot{display:none}
    .id h1{font-size:18px;margin:0}
    .side-nav{flex-direction:row;margin:0 0 0 auto;gap:14px}
    .side-nav a{border:none;padding:4px 0;font-size:13px}
    .side-nav a span{display:none}
    main{margin-left:0}
    .wrap{padding:0 22px}
    section{padding:80px 0}
    .toast{left:50%}
    .pillars,.two{grid-template-columns:1fr}
    .pillar+.pillar{padding-left:0;border-left:0;border-top:1px solid var(--grid);margin-top:28px}
    .row{grid-template-columns:1fr;gap:2px}
    .contact{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .id h1{display:none} .side-nav{margin:0 auto}
    .works{grid-template-columns:1fr}
    .who{grid-template-columns:1fr}
    .who .photo{max-width:200px;margin-bottom:20px}
    .line{flex-wrap:wrap;font-size:20px}
  }
</style>
</head>

// 스테이지 맵 SVG
function stageMap() {
  const T = 40, W = 13, H = 10;
  // 지형 타일 (고정 패턴)
  const terrain = ["0,9","1,9","2,9","0,8","2,8","3,7","3,6","4,7","5,6","5,5","6,8","7,8","8,8","8,7","6,4","7,4","8,4","8,5","9,4","10,4","10,3","10,2","11,2","12,2","11,0","12,0","12,1","2,3","3,3","3,2","9,8","10,8","10,7","11,7","1,5","0,5"];
  const tiles = terrain.map(k => { const [x, y] = k.split(",").map(Number); return `<rect x="${x*T+2}" y="${y*T+2}" width="${T-4}" height="${T-4}" rx="3" fill="#dbe3ee"/>`; }).join("");
  const grid = [];
  for (let x = 0; x <= W; x++) grid.push(`<line x1="${x*T}" y1="0" x2="${x*T}" y2="${H*T}"/>`);
  for (let y = 0; y <= H; y++) grid.push(`<line x1="0" y1="${y*T}" x2="${W*T}" y2="${y*T}"/>`);
  // 경로는 타일을 따라 직각으로 꺾임
  const c = s => [s.x*T + T/2, s.y*T + T/2];
  let d = "";
  DATA.stages.forEach((s, i) => {
    const [x, y] = c(s);
    if (i === 0) { d += `M${x} ${y}`; return; }
    const [px] = c(DATA.stages[i-1]);
    d += ` H${x} V${y}`;
  });
  const nodes = DATA.stages.map((s, i) => {
    const [x, y] = c(s);
    const delay = (0.4 + i * 0.5).toFixed(2);
    let lx = x, ly = y, anchor = "middle";
    if (s.side === "below") ly = y + 34;
    else if (s.side === "above") ly = y - 44;
    else if (s.side === "left") { lx = x - 28; anchor = "end"; ly = y - 6; }
    else { lx = x + 28; anchor = "start"; ly = y - 6; }
    if (s.goal) return `
      <g class="node" style="animation-delay:${delay}s">
        <rect x="${x-17}" y="${y-17}" width="34" height="34" rx="4" fill="#ffc53d"/>
        <path d="M${x-6} ${y+9}V${y-9}l12 5-12 5" fill="none" stroke="#152033" stroke-width="2.4" stroke-linejoin="round"/>
        <text class="lbl" x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="13" font-weight="800" fill="#152033">${s.year}</text>
        <text class="lbl" x="${lx}" y="${ly+16}" text-anchor="${anchor}" font-size="12" fill="#4a5568">${s.label}</text>
      </g>`;
    return `
      <g class="node" style="animation-delay:${delay}s">
        <rect x="${x-11}" y="${y-11}" width="22" height="22" rx="3" fill="#fff" stroke="#2f54eb" stroke-width="3"/>
        <rect x="${x-4}" y="${y-4}" width="8" height="8" fill="#2f54eb"/>
        <text class="lbl" x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="13" font-weight="800" fill="#152033">${s.year}</text>
        <text class="lbl" x="${lx}" y="${ly+16}" text-anchor="${anchor}" font-size="12" fill="#4a5568">${s.label}</text>
      </g>`;
  }).join("");
  return `<svg viewBox="-6 -6 ${W*T+12} ${H*T+12}" role="img" aria-label="경력 경로: ${DATA.stages.map(s => s.year + " " + s.label).join(", ")}">
    ${tiles}<g stroke="#e3e8ef" stroke-width="1">${grid.join("")}</g>
    <path class="route" d="${d}" fill="none" stroke="#2f54eb" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter" stroke-dasharray="1200"/>
    ${nodes}</svg>`;
}
