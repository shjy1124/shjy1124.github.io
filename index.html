<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 검색엔진에 노출되지 않도록 설정 (링크를 아는 사람만 접근) -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>손지윤 | Game Designer Portfolio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000; --dark:#111; --dark-2:#1a1a1a; --white:#fff;
    --g100:#e5e5e5; --g300:#b0b0b0; --g500:#7a7a7a;
    --line:rgba(255,255,255,.14);
    --accent:#60a5fa;          /* 어두운 배경용 강조색 */
    --accent-l:#2563eb;        /* 밝은 배경용 강조색 */
    --ink:#111; --ink2:#444; --ink3:#8a8a8a; --rule:rgba(0,0,0,.12);
    --navy:#0a3163; --signal:#ff5b2e; --side:280px; --mono:"JetBrains Mono",ui-monospace,monospace;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;background:var(--black);color:var(--white);line-height:1.65;word-break:keep-all;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .ac{color:var(--accent)}
  b{font-weight:700}

  /* ===== SIDEBAR (유지) ===== */
  aside{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#fff;padding:40px 32px;display:flex;flex-direction:column;z-index:20}
  .id small{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#8fa7c9}
  .id h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
  .id p{font-size:14px;color:#c4d1e4}
  .side-nav{margin-top:56px;list-style:none;display:flex;flex-direction:column;gap:2px}
  .side-nav a{display:flex;align-items:baseline;gap:14px;padding:10px 0;color:#8fa7c9;font-weight:600;font-size:15px;transition:.2s;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-nav a span{font-family:var(--mono);font-size:11px;width:20px}
  .side-nav a:hover,.side-nav a.on{color:#fff}
  .side-nav a.on span{color:var(--signal)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
  .side-foot a.dl{display:flex;justify-content:space-between;padding:12px 14px;border:1px solid rgba(255,255,255,.3);border-radius:6px;font-weight:700;transition:.2s}
  .side-foot a.dl:hover{background:#fff;color:var(--navy)}
  .side-foot .mail{color:#8fa7c9;font-family:var(--mono);font-size:12px}

  main{margin-left:var(--side)}
  .inner{max-width:1180px;margin:0 auto;padding:0 40px}
  .eyebrow{font-size:13px;letter-spacing:.32em;color:var(--g300);text-transform:uppercase}

  /* 공통 버튼 */
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;font-size:15px;font-weight:700;border:1px solid rgba(255,255,255,.35);transition:.2s;cursor:pointer;background:rgba(10,10,10,.5);color:#fff;font-family:inherit}
  .btn:hover{border-color:#fff}
  .btn.primary{background:#fff;color:#000;border-color:#fff}
  .btn.primary:hover{background:var(--g100)}
  .btn svg{width:16px;height:16px}

  /* 스크롤 표시 */
  .scroll{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--g500);padding:40px 0}
  .scroll i{width:22px;height:34px;border:1.5px solid var(--g500);border-radius:12px;position:relative}
  .scroll i::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff;animation:wheel 1.6s infinite}
  @keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
  .light .scroll i{border-color:var(--ink3)} .light .scroll i::after{background:var(--ink)}

  /* ===== 01 HERO ===== */
  #about{position:relative}
  .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 24px 40px;overflow:hidden}
  .hero-bg{position:absolute;inset:0;background:
      radial-gradient(60% 50% at 30% 40%,rgba(96,165,250,.22),transparent 70%),
      radial-gradient(50% 45% at 72% 60%,rgba(255,91,46,.14),transparent 70%),
      radial-gradient(40% 40% at 55% 25%,rgba(10,49,99,.55),transparent 70%),#050505;
      background-size:cover;background-position:center;filter:saturate(1.1)}
  .hero-bg.img{filter:blur(2px) brightness(.55)}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 65% at 50% 45%,transparent 30%,rgba(0,0,0,.92) 85%);pointer-events:none}
  .hero > *:not(.hero-bg):not(.hero-slides){position:relative;z-index:1}
  .hero-slides{position:absolute;inset:0;overflow:hidden}
  .hero-slides .hs{position:absolute;inset:-20px;background-size:cover;background-position:center;opacity:0;filter:blur(3px) brightness(.42) saturate(1.1);transform:scale(1.04);transition:opacity 1.6s ease,transform 7s linear}
  .hero-slides .hs.on{opacity:1;transform:scale(1.12)}
  .hero .eyebrow{margin-bottom:22px}
  .hero .sub{font-size:clamp(24px,3vw,36px);font-weight:600;letter-spacing:-.03em}
  .hero .sub b{color:var(--accent);font-weight:800}
  .hero h2{font-size:clamp(64px,9vw,112px);font-weight:900;letter-spacing:-.05em;line-height:1.1;margin:6px 0 26px}
  .hero .desc{font-size:17px;color:var(--g300);margin-bottom:26px}
  .hero .desc b{color:#fff}
  .pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
  .pills span{font-size:13px;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--g100)}

  /* ABOUT ME */
  .about{padding-top:80px;text-align:center}
  .about h3{font-size:clamp(30px,3.6vw,44px);font-weight:800;letter-spacing:-.04em;margin:14px 0 18px}
  .about h3 b{color:var(--accent)}
  .about .desc{color:var(--g300);font-size:16px;margin-bottom:48px}
  .about .desc b{color:#fff}
  .tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 20px;text-align:left;margin-bottom:40px}
  .tl-step{position:relative;padding-top:28px}
  .tl-step::before{content:"";position:absolute;top:6px;left:0;right:-20px;height:1px;background:var(--line)}
  .tl-step:last-child::before{right:0}
  .tl-step::after{content:"";position:absolute;top:1px;left:0;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--g300);background:#000}
  .tl-step.now::before{background:var(--accent);height:2px}
  .tl-step.now::after{background:var(--accent);border-color:var(--accent)}
  .tl-step small{font-size:13px;color:var(--g500)}
  .tl-step h4{font-size:22px;font-weight:800;margin:4px 0}
  .tl-step p{font-size:13px;color:var(--g300);margin-bottom:10px}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(96,165,250,.12);color:var(--accent)}
  .about-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;text-align:left}
  .acard{background:var(--dark);border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px}
  .acard .big{font-family:var(--mono);font-size:clamp(28px,2.8vw,40px);font-weight:700;color:var(--accent);letter-spacing:-.04em;line-height:1.1}
  .acard .big small{white-space:nowrap;font-size:14px;color:var(--g500);font-family:"Pretendard Variable",Pretendard,sans-serif;font-weight:500;margin-left:6px;letter-spacing:0}
  .acard h5{font-size:20px;font-weight:800;margin:18px 0 4px}
  .acard .lead{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:14px}
  .acard ul{list-style:none;display:grid;gap:6px}
  .acard li{font-size:14px;color:var(--g300);padding-left:14px;position:relative}
  .acard li::before{content:"";position:absolute;left:0;top:10px;width:4px;height:4px;border-radius:50%;background:var(--g500)}
  .acard li b{color:#fff}

  /* ===== 02 RESUME (밝은 섹션) ===== */
  .light{background:#fff;color:var(--ink)}
  #resume{padding:110px 0 20px}
  .resume{display:grid;grid-template-columns:260px 1fr;gap:44px}
  .pcard{background:#f5f5f5;border-radius:var(--radius);padding:30px 26px;align-self:start}
  .pcard h3{font-size:24px;font-weight:800;color:var(--accent-l);border-left:3px solid var(--accent-l);padding-left:10px;line-height:1.1;margin-bottom:26px}
  .pcard .photo{width:100%;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:#ddd;margin-bottom:26px}
  .pcard .photo img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
  .pcard .nm{font-size:20px;font-weight:800;letter-spacing:.3em}
  .pcard .en{color:var(--ink2);font-size:15px}
  .pcard .bd{color:var(--ink2);font-size:15px;margin-bottom:26px}
  .pcard .ml{font-size:15px}
  .pcard .ml span{color:var(--accent-l);margin-right:10px}

  .rg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px 48px}
  .rg h4{font-size:17px;font-weight:800;color:var(--accent-l);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
  .rg h4 small{font-size:12px;color:var(--ink3);font-weight:500;margin-left:6px}
  .rg h4 .more-btn{font-size:12px;font-weight:600;color:var(--ink);border:1px solid var(--rule);padding:3px 12px;border-radius:999px;background:#fff;cursor:pointer;font-family:inherit}
  .rsec{padding-bottom:28px;border-bottom:1px solid var(--rule)}
  .stats{display:flex;gap:0;margin-bottom:22px}
  .stats div{padding-right:28px}
  .stats div+div{padding-left:28px;border-left:1px solid var(--rule)}
  .stats small{display:block;font-size:12px;color:var(--ink3)}
  .stats b{font-size:26px;font-weight:800;letter-spacing:-.03em}
  .stats div:first-child b{color:var(--accent-l)}
  .crow{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:14px;padding:4px 0}
  .crow .co{font-weight:600}
  .crow .tm{color:var(--ink2)}
  .crow ul{grid-column:2;list-style:none;margin:4px 0 0;display:grid;gap:3px}
  .crow li{font-size:13px;color:var(--ink2);padding-left:12px;position:relative}
  .crow li::before{content:"-";position:absolute;left:0;color:var(--ink3)}
  .prow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;font-size:14px;padding:5px 0}
  .prow .y{font-weight:800}
  .prow .r{color:var(--ink2)}
  .cdetail{grid-column:1/-1;padding:24px 26px;background:#f5f5f5;border-radius:var(--radius)}
  .cdetail h4{font-size:17px;font-weight:800;color:var(--accent-l);margin-bottom:18px}
  .cd-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
  .cd-lab{font-size:13px;font-weight:700;color:var(--ink3);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
  .cd-g{margin-bottom:16px}
  .cd-g b{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
  .cd-g ul{list-style:none;display:grid;gap:4px}
  .cd-g li{font-size:13px;color:var(--ink2);padding-left:12px;position:relative;line-height:1.6}
  .cd-g li::before{content:"";position:absolute;left:0;top:.68em;width:4px;height:4px;border-radius:50%;background:var(--accent-l)}
  .rg3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
  .erow{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:14px;padding:6px 0}
  .erow .y{font-weight:800;color:var(--ink)}
  .erow .t{font-weight:600}
  .erow .s{display:block;font-size:12px;color:var(--ink3);font-weight:400}
  .erow .s.wh{color:var(--accent-l);font-weight:600;font-variant-numeric:tabular-nums}
  .erow.more{display:none}
  .open .erow.more{display:grid}
  .rsec.col{border-bottom:none}

  /* ===== 03 WORKS ===== */
  #works{padding:100px 0 0}
  .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:44px}
  .tabs button{font-family:inherit;font-size:15px;font-weight:700;padding:10px 24px;border-radius:999px;border:1px solid var(--line);background:transparent;color:#fff;cursor:pointer;transition:.2s}
  .tabs button.on{background:#fff;color:#000;border-color:#fff}
  .wgroup{max-width:1500px;margin:0 auto 18px;padding:0 24px;display:flex;align-items:baseline;gap:10px}
  .wgroup h3{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .wgroup span{font-size:14px;color:var(--g500)}
  .works-grid + .wgroup{margin-top:56px}
  .works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding:0 24px;max-width:1500px;margin:0 auto}
  .wcard{background:var(--dark);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.25s}
  .wcard:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.35)}
  .wthumb{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .wthumb img{width:100%;height:100%;object-fit:cover}
  .wthumb .ph{font-size:20px;font-weight:800;color:#fff;padding:20px;text-align:center;line-height:1.35;letter-spacing:-.02em}
  .wbody{padding:18px 18px 18px;display:flex;flex-direction:column;flex:1}
  .wmeta{font-size:12px;color:var(--g500);margin-bottom:8px}
  .wbody h5{font-size:17px;font-weight:800;line-height:1.35;margin-bottom:8px;letter-spacing:-.02em}
  .wbody p{font-size:13px;color:var(--g300);margin-bottom:14px;flex:1}
  .wtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
  .wtags span{font-size:11px;padding:3px 9px;border:1px solid var(--line);border-radius:5px;color:var(--g100)}
  .wlink{font-size:13px;font-weight:700;padding-top:14px;border-top:1px solid var(--line)}
  .wlink.soon{color:var(--g500)}
  .wcard a.wlink:hover{color:var(--accent)}

  /* ===== 작업 상세 팝업 ===== */
  .wcard{cursor:pointer}
  .wcard:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .wcard:hover .wlink{color:var(--accent)}
  dialog{border:0;padding:0;color:#fff;background:transparent}
  dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
  body:has(dialog[open]){overflow:hidden}
  .modal{width:min(880px,calc(100vw - 32px));max-height:calc(100vh - 48px);margin:auto;border-radius:18px;background:var(--dark);border:1px solid var(--line);overflow:hidden}
  .modal[open]{display:flex;flex-direction:column;animation:mIn .22s ease-out}
  @keyframes mIn{from{opacity:0;transform:translateY(12px)}}
  .m-content{overflow-y:auto}
  .m-close{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:22px;line-height:1;cursor:pointer}
  .m-close:hover{background:#fff;color:#000}
  .m-head{min-height:200px;display:flex;align-items:flex-end;padding:28px 32px;background-size:cover;background-position:center}
  .m-kind{font-size:13px;color:rgba(255,255,255,.75);margin-bottom:4px}
  .m-head h3{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
  .m-video{aspect-ratio:16/9;background:#000}
  .m-video iframe{width:100%;height:100%;border:0;display:block}
  .m-vcap{font-size:13px;color:var(--g500);padding:12px 32px 0}
  .m-vcap a{color:var(--accent);font-weight:600;margin-left:4px}
  .m-body{padding:28px 32px 36px;display:grid;gap:26px}
  .m-intro{font-size:15px;color:var(--g300)}
  .m-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .m-gallery figure{margin:0}
  .m-gallery figure:last-child:nth-child(odd){grid-column:1/-1}
  .m-gallery .g-img{display:block;width:100%;aspect-ratio:16/9;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#1a1a1a;cursor:zoom-in}
  .m-gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
  .m-gallery .g-img:hover img{transform:scale(1.03)}
  .m-gallery figcaption{font-size:13px;color:var(--g300);margin-top:8px;text-align:center}
  .m-meta{display:grid;grid-template-columns:auto 1fr;gap:8px 24px;font-size:15px;padding:18px 20px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .m-meta dt{color:var(--g500)}
  .m-stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
  .m-stats > :only-child{grid-column:1/-1}
  .m-card{padding:20px;border-radius:12px;background:var(--dark-2);border:1px solid var(--line)}
  .m-card h4,.m-sec h4{font-size:16px;font-weight:800;margin-bottom:10px;color:#fff}
  .m-card ul{list-style:none;display:grid;gap:6px}
  .m-card li{font-size:14px;color:var(--g100);padding-left:14px;position:relative}
  .m-card li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .contrib{display:flex;gap:18px;align-items:center}
  .donut{--p:50;flex-shrink:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.1) 0);display:grid;place-items:center;position:relative}
  .donut::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--dark-2)}
  .donut span{position:relative;font-size:11px;color:var(--g300);text-align:center;line-height:1.2}
  .donut b{display:block;font-size:22px;color:#fff}
  .donut small{font-size:12px}
  .m-sec p{font-size:15px;color:var(--g300);line-height:1.8}
  .m-links{display:grid;gap:10px}
  .m-link{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center;padding:12px;border-radius:12px;background:var(--dark-2);border:1px solid var(--line);transition:border-color .2s}
  .m-link:hover{border-color:var(--accent)}
  .m-link .lt{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000}
  .m-link .lt img{width:100%;height:100%;object-fit:cover;display:block}
  .m-link .lt i{position:absolute;inset:0;margin:auto;width:40px;height:28px;border-radius:8px;background:#f00;color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
  .m-link b{display:block;font-size:15px;margin-bottom:4px}
  .m-link small{display:block;font-size:13px;color:var(--g300);margin-bottom:6px}
  .m-link em{font-style:normal;font-size:13px;font-weight:700;color:var(--accent)}
  @media(max-width:700px){ .m-link{grid-template-columns:1fr} }
  .doc-desc{font-size:14px;color:var(--g300);margin:-4px 0 12px}
  .doc-thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
  .doc-thumb{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#222;cursor:pointer;padding:0;color:#fff;font-family:inherit;font-weight:700}
  .doc-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
  .doc-thumb:hover img{transform:scale(1.04)}
  .doc-thumb span{position:absolute;right:6px;bottom:6px;font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.6)}
  .doc-actions{display:flex;gap:8px;flex-wrap:wrap}
  .doc-empty{font-size:14px;color:var(--g500);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  .viewer{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;background:rgba(10,10,10,.96)}
  .viewer[open]{display:flex;flex-direction:column}
  .v-bar{position:relative;display:flex;align-items:center;justify-content:center;padding:14px 64px;border-bottom:1px solid var(--line)}
  .v-bar .m-close{top:8px}
  .v-title{font-size:15px;font-weight:700}
  .v-pages{overflow-y:auto;flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px 60px}

    ${DATA.heroSlides && DATA.heroSlides.length ? `<div class="hero-slides" aria-hidden="true">${DATA.heroSlides.map((src, i) => `<div class="hs ${i === 0 ? "on" : ""}" style="background-image:url('${src}')"></div>`).join("")}</div>` : ""}
    <div class="eyebrow">Game Designer Portfolio</div>
    <div class="sub">${DATA.hero.sub}</div>
    <h2>${DATA.fullName}</h2>
    <p class="desc">${DATA.hero.desc}</p>
    <div class="pills">${DATA.hero.tags.map(t => `<span>${t}</span>`).join("")}</div>
    <div class="btns">
      ${DATA.resumeFile ? `<a class="btn primary" href="${DATA.resumeFile}" target="_blank">${dlIcon}이력서 다운로드</a>` : ""}
      <a class="btn" href="#contact">${mailIcon}연락처</a>
    </div>
    ${scroll("about-me")}
  </div>
  <div class="about inner" id="about-me">
    <div class="eyebrow">About Me</div>
    <h3>${A.title}</h3>
    <p class="desc">${A.desc}</p>
    <div class="tl">${A.timeline.map(t => `
      <div class="tl-step ${t.now ? "now" : ""}"><small>${t.when}</small><h4>${t.title}</h4><p>${t.org}</p><span class="chip">${t.chip}</span></div>`).join("")}
    </div>
    <div class="about-cards">${A.cards.map(c => `
      <div class="acard">
        <div class="big">${c.big}<small>${c.unit}</small></div>
        <h5>${c.title}</h5>
        <div class="lead">${c.lead}</div>
        <ul>${c.points.map(p => `<li>${p}</li>`).join("")}</ul>
      </div>`).join("")}
    </div>
    ${scroll("resume")}
  </div>`;

// 첫 화면 배경 슬라이드
(() => {
  const slides = document.querySelectorAll(".hero-slides .hs");
  if (slides.length < 2 || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let cur = 0;
  setInterval(() => {
    slides[cur].classList.remove("on");
    cur = (cur + 1) % slides.length;
    slides[cur].classList.add("on");
  }, 5000);
})();

// 02 RESUME
const erows = arr => arr.map(r => `
  <div class="erow ${r.more ? "more" : ""}"><span class="y">${r.y}</span><span><span class="t">${r.title}</span>${r.when ? `<span class="s wh">${r.when}</span>` : ""}<span class="s">${r.sub}</span></span></div>`).join("");
const moreBtn = arr => arr.some(r => r.more)
  ? `<button class="more-btn" onclick="const s=this.closest('.rsec');s.classList.toggle('open');this.textContent=s.classList.contains('open')?'− 접기':'+ 더보기'">+ 더보기</button>` : "";
$("#resume").innerHTML = `
  <div class="inner">
    <div class="resume">
      <div class="pcard">
        <h3>이력서</h3>
        <div class="photo">${DATA.photo ? `<img src="${DATA.photo}" alt="${DATA.fullName}">` : ""}</div>
        <div class="nm">${DATA.fullName.split("").join(" ")}</div>
        <div class="en">${DATA.enName}</div>
        <div class="bd">${DATA.birth}</div>
        <div class="ml"><span>E-mail.</span>${DATA.contact.email}</div>
      </div>
      <div class="rg">
        <div class="rsec">
          <h4>경력사항</h4>
          <div class="stats">${DATA.stats.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join("")}</div>
          ${DATA.career.map(c => `
          <div class="crow"><span class="co">${c.co}</span><span class="tm">${c.when}</span>
            <ul><li>${c.team}</li>${c.points.map(p => `<li>${p}</li>`).join("")}</ul></div>`).join("")}
        </div>
        <div class="rsec">
          <h4><span>프로젝트<small>(담당 직군 / 게임 기획)</small></span></h4>
          ${DATA.projects.map(p => `<div class="prow"><span class="y">${p.y}</span><span>${p.title}</span><span class="r">${p.role}</span></div>`).join("")}
        </div>
        <div class="rg3">
          <div class="rsec col"><h4>학력사항</h4>${erows(DATA.education)}</div>
          <div class="rsec col"><h4>선정 및 전시 ${moreBtn(DATA.selections)}</h4>${erows(DATA.selections)}</div>
          <div class="rsec col"><h4>수상 ${moreBtn(DATA.awards)}</h4>${erows(DATA.awards)}</div>
        </div>
      </div>
    </div>
    ${scroll("works")}
  </div>`;

// 03 WORKS
const kindLabel = { project: "프로젝트", doc: "기획서" };
let filter = "all";
function renderWorks() {
  const list = DATA.works.filter(w => filter === "all" || w.kind === filter);
  $("#works").innerHTML = `
    <div class="tabs">${[["all", "전체"], ["project", "프로젝트"], ["doc", "기획서"]].map(([k, l]) =>
      `<button class="${filter === k ? "on" : ""}" data-k="${k}">${l}</button>`).join("")}</div>
    ${(filter === "all" ? [["project", "프로젝트"], ["doc", "기획서"]] : [[filter, ""]]).map(([k, label]) => {
      const items = list.filter(w => w.kind === k);
      if (!items.length) return "";
      return `${label ? `<div class="wgroup"><h3>${label}</h3><span>${items.length}</span></div>` : ""}<div class="works-grid">${items.map(w => `
      <article class="wcard" tabindex="0" role="button" data-id="${w.id}" aria-label="${w.title} 상세 보기">
        <div class="wthumb" style="${w.thumb ? "" : `background:linear-gradient(135deg,${w.color},${w.color}aa)`}">
          ${w.thumb ? `<img src="${w.thumb}" alt="${w.title}" loading="lazy">` : `<div class="ph">${w.title}</div>`}
        </div>
        <div class="wbody">
          <div class="wmeta">${kindLabel[w.kind]} / ${w.platform} / ${w.year}</div>
          <h5>${w.title}</h5>
          <p>${w.desc}</p>
          <div class="wtags">${w.tags.map(t => `<span>${t}</span>`).join("")}</div>
          <span class="wlink">${w.opens ? "기획서 상세 보기" : ""}${w.opens ? "" : (DATA.details[w.id] && DATA.details[w.id].video ? (w.kind === "doc" ? "기획서 & 영상 보기" : "상세 정보 & 영상 보기") : (w.kind === "doc" ? "기획서 상세 보기" : "상세 정보 보기"))} ↗</span>
        </div>
      </article>`).join("")}
    </div>`;
    }).join("")}
    ${scroll("play")}`;
  $("#works").querySelectorAll(".tabs button").forEach(b => b.onclick = () => { filter = b.dataset.k; renderWorks(); });
  $("#works").querySelectorAll(".wcard").forEach(c => {
    c.onclick = () => openCard(c.dataset.id);
    c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCard(c.dataset.id); } };
  });
}
renderWorks();

// 다른 작업의 팝업을 여는 카드 (예: PIO 기획서 -> PIO 프로젝트의 기획서 위치)
function openCard(id) {
  const w = DATA.works.find(x => x.id === id);
  if (!w.opens) return openWork(id);
  openWork(w.opens);
  const target = document.querySelector("#work-modal .doc-sec");
  if (target) requestAnimationFrame(() => target.scrollIntoView({ block: "start" }));
}

// 작업 상세 팝업
const pad2 = n => String(n).padStart(2, "0");
function docPages(d) { const n = d.pages >= 100 ? 3 : 2; return Array.from({ length: d.pages }, (_, i) => `${d.folder}/${String(i + 1).padStart(n, "0")}.jpg`); }
function openWork(id) {
  const w = DATA.works.find(x => x.id === id), d = DATA.details[id] || {};
  const M = $("#work-modal");
  const list = (t, arr) => arr && arr.length ? `<section class="m-card"><h4>${t}</h4><ul>${arr.map(x => `<li>${x}</li>`).join("")}</ul></section>` : "";
  const donut = d.contrib ? `<div class="donut" style="--p:${d.contrib}"><span>전체 기획<b>${d.contrib}<small>%</small></b></span></div>` : "";
  const docs = d.docs || (d.doc ? [Object.assign({ title: w.title }, d.doc)] : []);
  const docHtml = docs.map((doc, di) => {
    const pages = docPages(doc);
    return `<section class="m-sec doc-sec"><h4>${doc.title}</h4>${doc.desc ? `<p class="doc-desc">${doc.desc}</p>` : ""}${pages.length
      ? `<div class="doc-thumbs">${pages.slice(0, 7).map((src, i) => `<button class="doc-thumb" data-d="${di}" data-i="${i}"><img src="${src}" alt="${i + 1}쪽" loading="lazy"><span>${i + 1}</span></button>`).join("")}${pages.length > 7 ? `<button class="doc-thumb more" data-d="${di}" data-i="7">+${pages.length - 7}쪽</button>` : ""}</div>
         <div class="doc-actions"><button class="btn primary" data-d="${di}" data-i="0">전체 ${pages.length}쪽 크게 보기</button>${doc.pdf ? `<a class="btn" href="${doc.pdf}" target="_blank" download>PDF 다운로드</a>` : ""}</div>`
      : `<p class="doc-empty">기획서 페이지를 정리하고 있습니다.</p>`}</section>`;
  }).join("");
  M.querySelector(".m-content").innerHTML = `
    <div class="m-head" style="${w.thumb ? `background-image:linear-gradient(transparent 30%,#111),url('${w.thumb}')` : `background:linear-gradient(135deg,${w.color},${w.color}66)`}">
      <div><div class="m-kind">${kindLabel[w.kind]} / ${w.platform} / ${w.year}</div><h3 id="m-title">${w.title}</h3></div>
    </div>
    ${d.video ? `<div class="m-video"><iframe src="https://www.youtube-nocookie.com/embed/${d.video}" title="${w.title} 영상" referrerpolicy="strict-origin-when-cross-origin" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>${d.videoCaption ? `<p class="m-vcap">${d.videoCaption} <a href="https://www.youtube.com/watch?v=${d.video}" target="_blank">유튜브에서 보기 ↗</a></p>` : ""}` : ""}
    <div class="m-body">
      ${d.intro ? `<p class="m-intro">${d.intro}</p>` : ""}
      ${d.gallery ? `<div class="m-gallery">${d.gallery.map((g, i) => `<figure><button class="g-img" data-g="${i}"><img src="${g.src}" alt="${g.cap}" loading="lazy"></button><figcaption>${g.cap}</figcaption></figure>`).join("")}</div>` : ""}
      ${d.meta ? `<dl class="m-meta">${d.meta.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : ""}
      ${(d.role || d.results) ? `<div class="m-stats">${d.role ? `<section class="m-card"><h4>담당 업무</h4><div class="contrib">${donut}<ul>${d.role.map(x => `<li>${x}</li>`).join("")}</ul></div></section>` : ""}${list("성과 및 결과", d.results)}</div>` : ""}
      ${d.links ? `<section class="m-sec"><h4>관련 영상</h4><div class="m-links">${d.links.map(l => `<a class="m-link" href="https://www.youtube.com/watch?v=${l.video}" target="_blank"><span class="lt"><img src="https://i.ytimg.com/vi/${l.video}/hqdefault.jpg" alt="" loading="lazy"><i>▶</i></span><span><b>${l.title}</b><small>${l.desc}</small><em>유튜브에서 보기 ↗</em></span></a>`).join("")}</div></section>` : ""}
      ${(d.sections || []).map(s => `<section class="m-sec"><h4>${s.h}</h4><p>${s.p}</p></section>`).join("")}
      ${docHtml}
      ${!d.sections && !d.doc ? `<p class="m-sec">${w.desc}</p>` : ""}
    </div>`;
  M.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { const doc = docs[+b.dataset.d || 0]; openViewer(doc.title, docPages(doc), +b.dataset.i); });
  M.querySelectorAll("[data-g]").forEach(b => b.onclick = () => openViewer(w.title, d.gallery.map(g => g.src), +b.dataset.g));
  M.showModal();
  M.querySelector(".m-content").scrollTop = 0;
}
function openViewer(title, pages, start) {
  const V = $("#doc-viewer");
  V.querySelector(".v-title").textContent = `${title} (${pages.length}쪽)`;
  V.querySelector(".v-pages").innerHTML = pages.map((src, i) => `<img id="vp${i}" src="${src}" alt="${i + 1}쪽" loading="lazy">`).join("");
  V.showModal();
  requestAnimationFrame(() => { const t = V.querySelector("#vp" + start); if (t) t.scrollIntoView(); });
}
document.querySelectorAll("dialog").forEach(dl => {
  dl.querySelector(".m-close").onclick = () => dl.close();
  dl.addEventListener("click", e => { if (e.target === dl) dl.close(); });
});

// 04 PLAY
const P = DATA.play;
$("#play").innerHTML = `
  <div class="inner play">
    <div class="play-text">
      <div class="eyebrow dk">Play Experience</div>
      <h3>${P.title}</h3>
      <ol>${P.points.map((p, i) => `<li><span>${String(i + 1).padStart(2, "0")}</span><p>${p}</p></li>`).join("")}</ol>
    </div>
    <div class="play-panel">
      <div class="cap">${P.caption}</div>
      <div class="games">${P.games.map(g => `
        <div class="game ${g.note ? "has-note" : ""}" title="${g.name}${g.note ? " (" + g.note + ")" : ""}" ${g.note ? `tabindex="0" role="button" aria-label="${g.name}, ${g.note}"` : ""}>
          <div class="gi" style="background:${g.color}">${g.icon ? `<img src="${g.icon}" alt="${g.name}">` : `<span>${g.name}</span>`}</div>
          ${g.deep ? `<i class="star" title="엔드 콘텐츠까지 즐긴 게임">★</i>` : ""}
          ${g.note ? `<span class="gnote">${g.note}</span><i class="gbadge" aria-hidden="true">!</i>` : ""}
        </div>`).join("")}
      </div>
      ${P.games.some(g => g.deep) ? `<div class="note"><i class="star s">★</i><b>${P.deepNote}</b></div>` : ""}
    </div>
  </div>
  ${scroll("fan")}`;

document.querySelectorAll(".game.has-note").forEach(g => {
  const t = () => g.classList.toggle("show-note");
  g.onclick = t; g.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } };
});

// 05 GAME LIFE
const F = DATA.fan;
$("#fan").innerHTML = `
  <div class="inner play fan">
    <div class="play-text">
      <div class="eyebrow dk">Off Screen</div>
      <h3>${F.title}</h3>
      <ol>${F.points.map((p, i) => `<li><span>${String(i + 1).padStart(2, "0")}</span><p>${p}</p></li>`).join("")}</ol>
    </div>
    <div class="fan-grid">${F.photos.map((ph, i) => `
      <figure class="${ph.size || ""}">
        ${ph.src ? `<button class="fp" data-f="${i}"><img src="${ph.src}" alt="${ph.cap}" loading="lazy"></button>` : `<div class="fp empty"><span>사진 ${i + 1}</span></div>`}
        ${ph.cap ? `<figcaption>${ph.cap}</figcaption>` : ""}
      </figure>`).join("")}
      <p class="fan-note">모두 직접 촬영한 사진입니다.</p>
    </div>
  </div>
  ${scroll("contact")}`;
$("#fan").querySelectorAll("[data-f]").forEach(b => b.onclick = () => openViewer("게임 생활", F.photos.filter(p => p.src).map(p => p.src), F.photos.filter(p => p.src).indexOf(F.photos[+b.dataset.f])));

// 06 CONTACT
const C = DATA.contact;
$("#contact").innerHTML = `
  <div class="eyebrow">Contact</div>
  <div class="c-sub">${DATA.hero.sub}</div>
  <div class="c-name"><b>${DATA.fullName}</b> 입니다.</div>
  <div class="c-list">
    <div class="c-item"><small>E-mail</small><b>${C.email}</b><button class="copy" data-v="${C.email}">복사</button></div>
    <div class="c-item"><small>Tel</small><b>${C.phone}</b><button class="copy" data-v="${C.phone}">복사</button></div>
  </div>
  <div class="btns">
    <a class="btn primary" href="mailto:${C.email}">메일 보내기</a>
    ${DATA.resumeFile ? `<a class="btn" href="${DATA.resumeFile}" target="_blank">이력서 다운로드</a>` : ""}
  </div>
  <footer><span>© 2026 ${DATA.fullName} / ${DATA.enName}</span><a href="#about">맨 위로 ↑</a></footer>`;

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }
document.querySelectorAll(".copy").forEach(b => b.onclick = async () => {
  try { await navigator.clipboard.writeText(b.dataset.v); toast("복사했습니다"); } catch { toast(b.dataset.v); }
});

const links = document.querySelectorAll(".side-nav a");
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll("main > section").forEach(s => io.observe(s));
</script>
</body>
</html>
