<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 검색엔진에 노출되지 않도록 설정 (링크를 아는 사람만 접근) -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>손지윤 | 게임 기획자 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3f2ee; --card:#fbfaf7; --ink:#0f1a2b; --sub:#5d6573; --faint:#9aa1ab; --line:#d9d7d0;
    --navy:#0a3163; --navy-2:#13427f; --signal:#ff5b2e;
    --side:280px; --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;color:var(--ink);background:var(--paper);line-height:1.65;word-break:keep-all;-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:32px 32px;background-attachment:fixed}
  body::before{content:"";position:fixed;inset:0;background:rgba(243,242,238,.82);pointer-events:none;z-index:-1}
  a{color:inherit;text-decoration:none}
  .mono{font-family:var(--mono)}

  /* SIDEBAR */
  aside{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#fff;padding:40px 32px;display:flex;flex-direction:column;z-index:20}
  .id small{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#8fa7c9}
  .id h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
  .id p{font-size:14px;color:#c4d1e4}
  .side-nav{margin-top:56px;list-style:none;display:flex;flex-direction:column;gap:2px}
  .side-nav a{display:flex;align-items:baseline;gap:14px;padding:10px 0;color:#8fa7c9;font-weight:600;font-size:15px;transition:.2s;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-nav a span{font-family:var(--mono);font-size:11px;width:20px}
  .side-nav a:hover,.side-nav a.on{color:#fff}
  .side-nav a.on span{color:var(--signal)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
  .side-foot a.dl{display:flex;justify-content:space-between;padding:12px 14px;border:1px solid rgba(255,255,255,.3);border-radius:6px;font-weight:700;transition:.2s}
  .side-foot a.dl:hover{background:#fff;color:var(--navy)}
  .side-foot .mail{color:#8fa7c9;font-family:var(--mono);font-size:12px}

  main{margin-left:var(--side)}
  .wrap{max-width:960px;padding:0 56px}
  section{padding:104px 0;border-bottom:1px solid var(--line)}
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:48px}
  .sec-head .no{font-family:var(--mono);font-size:13px;color:var(--signal);font-weight:700}
  .sec-head h2{font-size:30px;font-weight:800;letter-spacing:-.03em}
  .sec-head .en{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto;letter-spacing:.1em}

  /* HERO */
  #about{min-height:100vh;display:flex;align-items:center;padding:80px 0}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--navy);display:flex;align-items:center;gap:10px;margin-bottom:28px}
  .kicker::before{content:"";width:8px;height:8px;background:var(--signal)}
  .hero h2{font-size:clamp(38px,5.4vw,62px);font-weight:800;line-height:1.18;letter-spacing:-.045em;margin-bottom:28px}
  .hero h2 em{font-style:normal;background:linear-gradient(transparent 62%,rgba(255,91,46,.28) 62%)}
  .hero .lead{font-size:17px;color:var(--sub);max-width:640px;margin-bottom:22px}
  .hero .kw{font-family:var(--mono);font-size:13px;color:var(--navy);margin-bottom:56px;display:flex;flex-wrap:wrap;gap:6px 16px}
  .hl{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink)}
  .hl div{padding:22px 20px 0 0}
  .hl div+div{padding-left:20px;border-left:1px solid var(--line)}
  .hl b{display:block;font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-.04em;color:var(--navy);line-height:1.1}
  .hl small{font-size:13px;color:var(--sub)}

  /* RESUME */
  .profile{display:grid;grid-template-columns:168px 1fr;gap:36px;margin-bottom:64px;align-items:end}
  .photo{width:168px;aspect-ratio:3/4;overflow:hidden;border-radius:4px;background:#dfe4ec;filter:grayscale(.1)}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
  .pname{font-size:26px;font-weight:800}
  .pname small{font-family:var(--mono);font-size:13px;color:var(--faint);font-weight:400;margin-left:8px}
  .prole{color:var(--sub);margin-bottom:18px}
  .spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--ink)}
  .spec div{display:flex;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .spec dt{font-family:var(--mono);font-size:11px;color:var(--faint);width:84px;flex-shrink:0;white-space:nowrap;padding-top:3px;letter-spacing:.06em}

  .sub-h{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--navy);font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .sub-h::after{content:"";flex:1;height:1px;background:var(--line)}
  .timeline{position:relative;margin:0 0 64px;padding-left:28px}
  .timeline::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--navy)}
  .tl-item{position:relative}
  .tl-item::before{content:"";position:absolute;left:-28px;top:6px;width:12px;height:12px;background:var(--signal);border:3px solid var(--paper);box-sizing:content-box;margin-left:-3px}
  .tl-when{font-family:var(--mono);font-size:12px;color:var(--sub)}
  .tl-item h3{font-size:20px;font-weight:800;margin:2px 0}
  .tl-item .desc{color:var(--sub);font-size:14px;margin-bottom:14px}
  .tl-item ol{list-style:none;counter-reset:p;display:grid;gap:6px}
  .tl-item li{counter-increment:p;display:flex;gap:12px;font-size:15px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:4px}
  .tl-item li::before{content:counter(p,decimal-leading-zero);font-family:var(--mono);font-size:11px;color:var(--signal);padding-top:4px;font-weight:700}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:48px 40px}
  .list{margin-bottom:8px}
  .li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .li .w{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:3px}
  .li b{font-weight:700}
  .li span{color:var(--sub)}
  .more{display:none}
  .open .more{display:grid}
  .toggle{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--navy);background:none;border:none;cursor:pointer;font-weight:700}
  .full{grid-column:1/-1}
  .awards{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}

  /* WORKS */
  .filters{display:flex;gap:0;margin-bottom:32px;border:1px solid var(--ink);width:max-content;border-radius:4px;overflow:hidden}
  .filters button{font-family:var(--mono);font-size:12px;font-weight:600;padding:8px 16px;border:none;background:var(--card);color:var(--ink);cursor:pointer}
  .filters button+button{border-left:1px solid var(--ink)}
  .filters button.on{background:var(--ink);color:#fff}

  .feat{display:grid;grid-template-columns:1.1fr 1fr;background:var(--navy);color:#fff;border-radius:6px;overflow:hidden;margin-bottom:40px}
  .feat .vis{min-height:300px;position:relative;display:flex;align-items:flex-end;padding:28px;background:linear-gradient(135deg,var(--navy-2),#071f40)}
  .feat .vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .feat .vis .tagline{position:relative;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#8fa7c9}
  .feat .vis .big{position:absolute;top:24px;left:28px;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.2;max-width:80%}
  .feat .body{padding:32px}
  .feat .lab{font-family:var(--mono);font-size:11px;color:var(--signal);letter-spacing:.12em;margin-bottom:8px}
  .feat h3{font-size:24px;font-weight:800;margin-bottom:8px}
  .feat p{color:#c4d1e4;font-size:14px;margin-bottom:20px}
  .metrics{display:grid;gap:8px;margin-bottom:22px}
  .metrics div{display:flex;align-items:baseline;gap:14px;padding:10px 0;border-top:1px solid rgba(255,255,255,.14)}
  .metrics b{font-family:var(--mono);font-size:20px;min-width:72px;color:#fff}
  .metrics span{font-size:13px;color:#c4d1e4}
  .feat .go{display:inline-flex;gap:8px;font-weight:700;font-size:14px;padding:11px 18px;background:#fff;color:var(--navy);border-radius:4px}
  .feat .go.disabled{opacity:.5;pointer-events:none}

  .index{border-top:2px solid var(--ink)}
  .work{display:grid;grid-template-columns:44px 64px 1fr 120px 28px;gap:20px;align-items:center;padding:20px 8px;border-bottom:1px solid var(--line);transition:background .2s}
  .work:hover{background:var(--card)}
  .work .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .work .sw{width:64px;height:48px;border-radius:3px;overflow:hidden}
  .work .sw img{width:100%;height:100%;object-fit:cover}
  .work h4{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .work .k{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;margin-right:8px;vertical-align:2px}
  .k.project{background:var(--signal);color:#fff}
  .k.doc{background:var(--navy);color:#fff}
  .work p{font-size:13px;color:var(--sub);margin-top:2px}
  .work .t{font-family:var(--mono);font-size:11px;color:var(--navy);margin-top:6px}
  .work .pf{font-family:var(--mono);font-size:11px;color:var(--sub);text-align:right}
  .work .ar{font-size:18px;color:var(--faint);transition:.2s}
  .work:hover .ar{color:var(--signal);transform:translateX(4px)}
  .work.soon .ar{opacity:.3}
  .work.soon:hover .ar{transform:none;color:var(--faint)}

  /* CONTACT */
  #contact{border-bottom:none;padding-bottom:64px}
  .c-lead{color:var(--sub);margin-bottom:28px}
  .big-mail{display:inline-block;font-size:clamp(28px,4.4vw,48px);font-weight:800;letter-spacing:-.03em;color:var(--navy);border-bottom:3px solid var(--signal);line-height:1.2;cursor:pointer;margin-bottom:24px}
  .c-row{display:flex;gap:28px;flex-wrap:wrap;font-family:var(--mono);font-size:14px;margin-bottom:40px}
  .c-row button{font:inherit;background:none;border:none;cursor:pointer;color:var(--ink)}
  .c-row small{color:var(--faint);margin-right:8px}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;gap:8px;padding:13px 22px;border-radius:4px;font-weight:700;font-size:14px;border:1px solid var(--ink);transition:.2s}
  .btn.fill{background:var(--ink);color:#fff}
  .btn:hover{transform:translateY(-2px)}
  footer{display:flex;justify-content:space-between;margin-top:96px;font-family:var(--mono);font-size:11px;color:var(--faint)}

  .toast{position:fixed;left:calc(50% + var(--side)/2);bottom:32px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:4px;font-size:14px;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:960px){
    aside{position:sticky;top:0;inset:auto;width:100%;height:auto;flex-direction:row;align-items:center;padding:12px 20px}
    .id small,.id p,.side-foot{display:none}
    .id h1{font-size:18px;margin:0}
    .side-nav{flex-direction:row;margin:0 0 0 auto;gap:14px}
    .side-nav a{border:none;padding:4px 0;font-size:13px}
    .side-nav a span{display:none}
    main{margin-left:0}
    .wrap{padding:0 22px}
    section{padding:72px 0}
    .toast{left:50%}
    .hl{grid-template-columns:1fr}
    .hl div+div{padding-left:0;border-left:none;border-top:1px solid var(--line)}
    .hl div{padding:16px 0}
    .profile,.cols,.awards,.feat{grid-template-columns:1fr}
    .spec{grid-template-columns:1fr}
    .work{grid-template-columns:52px 1fr 20px;gap:14px}
    .work .n,.work .pf{display:none}
    .sec-head .en{display:none}
  }
  @media(max-width:520px){ .side-nav a:nth-child(n){font-size:12px} .id h1{display:none} .side-nav{margin:0 auto} }
</style>
</head>

let filter = "all";
function renderWorks() {
  const feat = DATA.works.find(w => w.featured);

  const showFeat = feat && (filter === "all" || feat.kind === filter);
  $("#works-body").innerHTML = `
    ${head("03", "프로젝트 &amp; 기획서", "WORKS")}
    <div class="filters">${[["all", "ALL"], ["project", "PROJECT"], ["doc", "DOC"]].map(([k, l]) => {
      const n = k === "all" ? DATA.works.length : DATA.works.filter(w => w.kind === k).length;
      return `<button class="${filter === k ? "on" : ""}" data-k="${k}">${l} ${pad(n)}</button>`;

    ${showFeat ? `
    <div class="feat">
      <div class="vis">${feat.thumb ? `<img src="${feat.thumb}" alt="">` : `<div class="big">${feat.title}</div>`}

        <p>${feat.desc}</p>

    </div>` : ""}

      <a class="work ${w.link ? "" : "soon"}" href="${w.link || "javascript:void(0)"}" ${w.link ? 'target="_blank"' : ""}>
        <span class="n">${pad(i + 1)}</span>
        <span class="sw" style="background:${w.color}">${w.thumb ? `<img src="${w.thumb}" alt="" loading="lazy">` : ""}</span>
        <span>
          <h4><span class="k ${w.kind}">${kindLabel[w.kind]}</span>${w.title}</h4>
          <p>${w.desc}</p>
          <div class="t">${w.tags.map(t => "#" + t).join("  ")}</div>
        </span>
        <span class="pf">${w.platform}<br>${w.year}</span>
        <span class="ar">${w.link ? "→" : "…"}</span>
      </a>`).join("")}
    </div>`;
  $("#works-body").querySelectorAll(".filters button").forEach(b => b.onclick = () => { filter = b.dataset.k; renderWorks(); });
}

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }
document.querySelectorAll(".copy").forEach(b => b.onclick = async () => {
  try { await navigator.clipboard.writeText(b.dataset.v); toast("복사했습니다"); } catch { toast(b.dataset.v); }
});

const links = document.querySelectorAll(".side-nav a");
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll("section").forEach(s => io.observe(s));
