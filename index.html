<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 검색엔진에 노출되지 않도록 설정 (링크를 아는 사람만 접근) -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>손지윤 | Game Designer Portfolio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000; --dark:#111; --dark-2:#1a1a1a; --white:#fff;
    --g100:#e5e5e5; --g300:#b0b0b0; --g500:#7a7a7a;
    --line:rgba(255,255,255,.14);
    --accent:#60a5fa;          /* 어두운 배경용 강조색 */
    --accent-l:#2563eb;        /* 밝은 배경용 강조색 */
    --ink:#111; --ink2:#444; --ink3:#8a8a8a; --rule:rgba(0,0,0,.12);
    --navy:#0a3163; --signal:#ff5b2e; --side:280px; --mono:"JetBrains Mono",ui-monospace,monospace;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;background:var(--black);color:var(--white);line-height:1.65;word-break:keep-all;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .ac{color:var(--accent)}
  b{font-weight:700}

  /* ===== SIDEBAR (유지) ===== */
  aside{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#fff;padding:40px 32px;display:flex;flex-direction:column;z-index:20}
  .id small{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#8fa7c9}
  .id h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
  .id p{font-size:14px;color:#c4d1e4}
  .side-nav{margin-top:56px;list-style:none;display:flex;flex-direction:column;gap:2px}
  .side-nav a{display:flex;align-items:baseline;gap:14px;padding:10px 0;color:#8fa7c9;font-weight:600;font-size:15px;transition:.2s;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-nav a span{font-family:var(--mono);font-size:11px;width:20px}
  .side-nav a:hover,.side-nav a.on{color:#fff}
  .side-nav a.on span{color:var(--signal)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
  .side-foot a.dl{display:flex;justify-content:space-between;padding:12px 14px;border:1px solid rgba(255,255,255,.3);border-radius:6px;font-weight:700;transition:.2s}
  .side-foot a.dl:hover{background:#fff;color:var(--navy)}
  .side-foot .mail{color:#8fa7c9;font-family:var(--mono);font-size:12px}

  main{margin-left:var(--side)}
  .inner{max-width:1180px;margin:0 auto;padding:0 40px}
  .eyebrow{font-size:13px;letter-spacing:.32em;color:var(--g300);text-transform:uppercase}

  /* 공통 버튼 */
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;font-size:15px;font-weight:700;border:1px solid rgba(255,255,255,.35);transition:.2s;cursor:pointer;background:rgba(10,10,10,.5);color:#fff;font-family:inherit}
  .btn:hover{border-color:#fff}
  .btn.primary{background:#fff;color:#000;border-color:#fff}
  .btn.primary:hover{background:var(--g100)}
  .btn svg{width:16px;height:16px}

  /* 스크롤 표시 */
  .scroll{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--g500);padding:40px 0}
  .scroll i{width:22px;height:34px;border:1.5px solid var(--g500);border-radius:12px;position:relative}
  .scroll i::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff;animation:wheel 1.6s infinite}
  @keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
  .light .scroll i{border-color:var(--ink3)} .light .scroll i::after{background:var(--ink)}

  /* ===== 01 HERO ===== */
  #about{position:relative}
  .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 24px 40px;overflow:hidden}
  .hero-bg{position:absolute;inset:0;background:
      radial-gradient(60% 50% at 30% 40%,rgba(96,165,250,.22),transparent 70%),
      radial-gradient(50% 45% at 72% 60%,rgba(255,91,46,.14),transparent 70%),
      radial-gradient(40% 40% at 55% 25%,rgba(10,49,99,.55),transparent 70%),#050505;
      background-size:cover;background-position:center;filter:saturate(1.1)}
  .hero-bg.img{filter:blur(2px) brightness(.55)}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 65% at 50% 45%,transparent 30%,rgba(0,0,0,.92) 85%);pointer-events:none}
  .hero > *:not(.hero-bg){position:relative;z-index:1}
  .hero .eyebrow{margin-bottom:22px}
  .hero .sub{font-size:clamp(24px,3vw,36px);font-weight:600;letter-spacing:-.03em}
  .hero .sub b{color:var(--accent);font-weight:800}
  .hero h2{font-size:clamp(64px,9vw,112px);font-weight:900;letter-spacing:-.05em;line-height:1.1;margin:6px 0 26px}
  .hero .desc{font-size:17px;color:var(--g300);margin-bottom:26px}
  .hero .desc b{color:#fff}
  .pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
  .pills span{font-size:13px;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--g100)}

  /* ABOUT ME */
  .about{padding-top:80px;text-align:center}
  .about h3{font-size:clamp(30px,3.6vw,44px);font-weight:800;letter-spacing:-.04em;margin:14px 0 18px}
  .about h3 b{color:var(--accent)}
  .about .desc{color:var(--g300);font-size:16px;margin-bottom:48px}
  .about .desc b{color:#fff}
  .tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 20px;text-align:left;margin-bottom:40px}
  .tl-step{position:relative;padding-top:28px}
  .tl-step::before{content:"";position:absolute;top:6px;left:0;right:-20px;height:1px;background:var(--line)}
  .tl-step:last-child::before{right:0}
  .tl-step::after{content:"";position:absolute;top:1px;left:0;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--g300);background:#000}
  .tl-step.now::before{background:var(--accent);height:2px}
  .tl-step.now::after{background:var(--accent);border-color:var(--accent)}
  .tl-step small{font-size:13px;color:var(--g500)}
  .tl-step h4{font-size:22px;font-weight:800;margin:4px 0}
  .tl-step p{font-size:13px;color:var(--g300);margin-bottom:10px}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(96,165,250,.12);color:var(--accent)}
  .about-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;text-align:left}
  .acard{background:var(--dark);border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px}
  .acard .big{font-family:var(--mono);font-size:clamp(28px,2.8vw,40px);font-weight:700;color:var(--accent);letter-spacing:-.04em;line-height:1.1}
  .acard .big small{font-size:14px;color:var(--g500);font-family:"Pretendard Variable",Pretendard,sans-serif;font-weight:500;margin-left:6px;letter-spacing:0}
  .acard h5{font-size:20px;font-weight:800;margin:18px 0 4px}
  .acard .lead{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:14px}
  .acard ul{list-style:none;display:grid;gap:6px}
  .acard li{font-size:14px;color:var(--g300);padding-left:14px;position:relative}
  .acard li::before{content:"";position:absolute;left:0;top:10px;width:4px;height:4px;border-radius:50%;background:var(--g500)}
  .acard li b{color:#fff}

  /* ===== 02 RESUME (밝은 섹션) ===== */
  .light{background:#fff;color:var(--ink)}
  #resume{padding:110px 0 20px}
  .resume{display:grid;grid-template-columns:260px 1fr;gap:44px}
  .pcard{background:#f5f5f5;border-radius:var(--radius);padding:30px 26px;align-self:start}
  .pcard h3{font-size:24px;font-weight:800;color:var(--accent-l);border-left:3px solid var(--accent-l);padding-left:10px;line-height:1.1;margin-bottom:26px}
  .pcard .photo{width:100%;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:#ddd;margin-bottom:26px}
  .pcard .photo img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
  .pcard .nm{font-size:20px;font-weight:800;letter-spacing:.3em}
  .pcard .en{color:var(--ink2);font-size:15px}
  .pcard .bd{color:var(--ink2);font-size:15px;margin-bottom:26px}
  .pcard .ml{font-size:15px}
  .pcard .ml span{color:var(--accent-l);margin-right:10px}

  .rg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px 48px}
  .rg h4{font-size:17px;font-weight:800;color:var(--accent-l);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
  .rg h4 small{font-size:12px;color:var(--ink3);font-weight:500;margin-left:6px}
  .rg h4 .more-btn{font-size:12px;font-weight:600;color:var(--ink);border:1px solid var(--rule);padding:3px 12px;border-radius:999px;background:#fff;cursor:pointer;font-family:inherit}
  .rsec{padding-bottom:28px;border-bottom:1px solid var(--rule)}
  .stats{display:flex;gap:0;margin-bottom:22px}
  .stats div{padding-right:28px}
  .stats div+div{padding-left:28px;border-left:1px solid var(--rule)}
  .stats small{display:block;font-size:12px;color:var(--ink3)}
  .stats b{font-size:26px;font-weight:800;letter-spacing:-.03em}
  .stats div:first-child b{color:var(--accent-l)}
  .crow{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:14px;padding:4px 0}
  .crow .co{font-weight:600}
  .crow .tm{color:var(--ink2)}
  .crow ul{grid-column:2;list-style:none;margin:4px 0 0;display:grid;gap:3px}
  .crow li{font-size:13px;color:var(--ink2);padding-left:12px;position:relative}
  .crow li::before{content:"-";position:absolute;left:0;color:var(--ink3)}
  .prow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;font-size:14px;padding:5px 0}
  .prow .y{font-weight:800}
  .prow .r{color:var(--ink2)}
  .rg3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
  .erow{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:14px;padding:6px 0}
  .erow .y{font-weight:800;color:var(--ink)}
  .erow .t{font-weight:600}
  .erow .s{display:block;font-size:12px;color:var(--ink3);font-weight:400}
  .erow.more{display:none}
  .open .erow.more{display:grid}
  .rsec.col{border-bottom:none}

  /* ===== 03 WORKS ===== */
  #works{padding:100px 0 0}
  .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:44px}
  .tabs button{font-family:inherit;font-size:15px;font-weight:700;padding:10px 24px;border-radius:999px;border:1px solid var(--line);background:transparent;color:#fff;cursor:pointer;transition:.2s}
  .tabs button.on{background:#fff;color:#000;border-color:#fff}
  .works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding:0 24px;max-width:1500px;margin:0 auto}
  .wcard{background:var(--dark);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.25s}
  .wcard:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.35)}
  .wthumb{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .wthumb img{width:100%;height:100%;object-fit:cover}
  .wthumb .ph{font-size:20px;font-weight:800;color:#fff;padding:20px;text-align:center;line-height:1.35;letter-spacing:-.02em}
  .wbody{padding:18px 18px 18px;display:flex;flex-direction:column;flex:1}
  .wmeta{font-size:12px;color:var(--g500);margin-bottom:8px}
  .wbody h5{font-size:17px;font-weight:800;line-height:1.35;margin-bottom:8px;letter-spacing:-.02em}
  .wbody p{font-size:13px;color:var(--g300);margin-bottom:14px;flex:1}
  .wtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
  .wtags span{font-size:11px;padding:3px 9px;border:1px solid var(--line);border-radius:5px;color:var(--g100)}
  .wlink{font-size:13px;font-weight:700;padding-top:14px;border-top:1px solid var(--line)}
  .wlink.soon{color:var(--g500)}
  .wcard a.wlink:hover{color:var(--accent)}

  /* ===== PLAY ===== */
  #play{padding:120px 0 20px}
  .play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:56px;align-items:center}
  .eyebrow.dk{color:var(--accent-l)}
  .play h3{font-size:clamp(30px,3.2vw,40px);font-weight:800;letter-spacing:-.04em;line-height:1.3;margin:14px 0 36px}
  .play h3 b{color:var(--accent-l)}
  .play ol{list-style:none;display:grid;gap:18px}
  .play li{display:grid;grid-template-columns:36px 1fr;font-size:15px;color:var(--ink2)}
  .play li span{font-weight:800;color:var(--accent-l)}
  .play li b{color:var(--accent-l)}
  .play-panel{background:#f5f5f5;border-radius:var(--radius);padding:24px}
  .play-panel .cap{font-size:13px;color:var(--ink3);margin-bottom:16px}
  .games{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .game{position:relative}
  .gi{aspect-ratio:1/1;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .gi img{width:100%;height:100%;object-fit:cover}
  .gi span{color:#fff;font-size:13px;font-weight:700;text-align:center;padding:8px;line-height:1.3}
  .star{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:#ffc53d;color:#fff;font-style:normal;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .star.s{position:static;display:inline-flex;width:20px;height:20px;font-size:11px;margin-right:8px;vertical-align:middle}
  .note{margin-top:18px;font-size:13px;color:var(--ink3)}
  .note b{color:var(--ink)}

  /* ===== 04 CONTACT ===== */
  #contact{padding:110px 0 0;text-align:center}
  #contact .eyebrow{margin-bottom:18px}
  .c-sub{font-size:clamp(20px,2.4vw,26px);font-weight:600}
  .c-sub b{color:var(--accent)}
  .c-name{font-size:clamp(48px,6.4vw,76px);font-weight:300;letter-spacing:-.04em;margin:4px 0 40px}
  .c-name b{font-weight:900}
  .c-list{max-width:520px;margin:0 auto 28px;display:grid;gap:12px}
  .c-item{display:flex;align-items:center;gap:20px;padding:18px 22px;border-radius:12px;background:var(--dark);border:1px solid var(--line);text-align:left}
  .c-item small{width:60px;font-size:13px;color:var(--g300)}
  .c-item b{flex:1;font-size:18px;font-weight:500}
  .c-item button{font-family:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;cursor:pointer}
  .c-item button:hover{background:#fff;color:#000}
  footer{display:flex;justify-content:space-between;margin-top:120px;padding:22px 24px;border-top:1px solid var(--line);font-size:12px;color:var(--g500)}

  .toast{position:fixed;left:calc(50% + var(--side)/2);bottom:32px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#000;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:1200px){ .resume{grid-template-columns:1fr} .pcard{display:grid;grid-template-columns:160px 1fr;gap:0 24px} .pcard h3{grid-column:1/-1} .pcard .photo{grid-row:span 5} }
  @media(max-width:960px){
    aside{position:sticky;top:0;inset:auto;width:100%;height:auto;flex-direction:row;align-items:center;padding:12px 20px}
    .id small,.id p,.side-foot{display:none}
    .id h1{font-size:18px;margin:0}
    .side-nav{flex-direction:row;margin:0 0 0 auto;gap:14px}
    .side-nav a{border:none;padding:4px 0;font-size:13px}
    .side-nav a span{display:none}
    main{margin-left:0}
    .inner{padding:0 20px}
    .toast{left:50%}
    .tl,.about-cards,.rg,.rg3,.play{grid-template-columns:1fr}
    .tl{gap:20px}
    .tl-step::before{right:0}
    .crow{grid-template-columns:1fr}
    .crow ul{grid-column:1}
  }
  @media(max-width:520px){ .id h1{display:none} .side-nav{margin:0 auto} .pcard{display:block} }
</style>
</head>
<body>

<!--
  ===========================================================
  내용 수정은 아래 <script> 안의 DATA 부분만 고치면 됩니다.
  - 썸네일: assets/thumbs 폴더에 넣고 thumb: "assets/thumbs/파일명.png"
  - 기획서 PDF: assets/docs 폴더에 넣고 link: "assets/docs/파일명.pdf"
  - 첫 화면 배경 이미지: heroBg: "assets/hero.jpg" (비우면 그라데이션)
  - link가 비어 있으면 '준비 중'으로 표시됩니다.
  ===========================================================
-->

<aside>
  <div class="id">
    <small>PORTFOLIO 2026</small>
    <h1 id="side-name"></h1>
    <p id="side-role"></p>
  </div>
  <nav>
    <ul class="side-nav">
      <li><a href="#about"><span>01</span>소개</a></li>
      <li><a href="#resume"><span>02</span>이력</a></li>
      <li><a href="#works"><span>03</span>작업</a></li>
      <li><a href="#play"><span>04</span>플레이 경험</a></li>
      <li><a href="#contact"><span>05</span>연락처</a></li>
    </ul>
  </nav>
  <div class="side-foot" id="side-foot"></div>
</aside>

<main>
  <section id="about"></section>
  <section id="resume" class="light"></section>
  <section id="works"></section>
  <section id="play" class="light"></section>
  <section id="contact"></section>
</main>

<div class="toast" id="toast"></div>

<script>
/* =================== 여기만 수정하세요 =================== */
const DATA = {
  name: "지윤",
  fullName: "손지윤",
  enName: "Son Jiyun",
  role: "게임 기획자 (레벨/콘텐츠)",
  birth: "2000. 11. 24",
  resumeFile: "assets/docs/resume.pdf",
  photo: "assets/photo.jpg",
  heroBg: "",

  hero: {
    sub: "<b>플레이를 만드는</b> 기획자",
    desc: "<b>레벨과 콘텐츠</b>를 설계하고, 몬스터 BT와 데이터까지 직접 조립합니다.<br>라이브 서비스에서 유저의 플레이 데이터로 재미를 확인하고 다듬어 왔습니다.",
    tags: ["#레벨디자인", "#콘텐츠", "#몬스터BT", "#기믹설계"]
  },

  about: {
    title: "<b>설계</b>에서 <b>구현</b>까지 직접 완성하는 기획자",
    desc: "게임 콘텐츠를 전공하고 인디 게임을 출시한 뒤, 라이브 서비스에서 <b>레벨 디자인, 이벤트 모드, 몬스터 기믹</b>을 맡아 왔습니다.<br>기획서로 끝나지 않고 플레이 가능한 상태까지 만드는 것을 가장 중요하게 생각합니다.",

    ${DATA.resumeFile ? `<a class="btn" href="${DATA.resumeFile}" target="_blank">이력서 다운로드</a>` : ""}
  </div>
  <footer><span>© 2026 ${DATA.fullName} / ${DATA.enName}</span><a href="#about">맨 위로 ↑</a></footer>`;

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }
document.querySelectorAll(".copy").forEach(b => b.onclick = async () => {
  try { await navigator.clipboard.writeText(b.dataset.v); toast("복사했습니다"); } catch { toast(b.dataset.v); }
});

const links = document.querySelectorAll(".side-nav a");
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll("main > section").forEach(s => io.observe(s));
</script>
</body>
</html>
