<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 검색엔진에 노출되지 않도록 설정 (링크를 아는 사람만 접근) -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>손지윤 | Game Designer Portfolio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<style>
  :root{
    /* 밝은 웜톤 (기본) */
    --black:#f3f1ec; --dark:#faf9f6; --dark-2:#ebe8e1; --white:#1e1e20;
    --g100:#3a3833; --g300:#58564f; --g500:#8b8880;
    --line:rgba(30,30,32,.12); --hair:rgba(30,30,32,.08); --soft:rgba(30,30,32,.04); --soft2:rgba(30,30,32,.05); --soft3:rgba(30,30,32,.1);
    --side-bg:#e5e1d9; --nav-fg:#5f5c55; --hero-bg:#f3f1ec; --veil-in:rgba(243,241,236,.74); --veil-out:rgba(243,241,236,.97);
    --hs-filter:blur(3px) brightness(.95) saturate(.9); --hb-filter:blur(2px) brightness(.95);
    --btn-line:rgba(30,30,32,.28); --btn-bg:rgba(250,249,246,.6); --inv-bg:#1e1e20; --inv-fg:#faf9f6;
    --light-bg:#faf9f6; --panel:#f1eee8; --panel2:#ebe8e1;
    --accent-soft:rgba(37,99,235,.1); --accent-line:rgba(37,99,235,.35);
    --accent:#2563eb;          /* 강조색 */
    --accent-l:#2563eb;        /* 밝은 배경용 강조색 */
    --ink:#111; --ink2:#444; --ink3:#8a8a8a; --rule:rgba(0,0,0,.12);
    --navy:#0a3163; --signal:#ff5b2e; --side:280px; --mono:"JetBrains Mono",ui-monospace,monospace;
    --radius:14px;
  }
  :root[data-theme="dark"]{
    /* 어두운 웜톤 */
    --black:#161513; --dark:#1f1d1a; --dark-2:#282622; --white:#f3efe8;
    --g100:#e6e1d8; --g300:#b3ada3; --g500:#807a71;
    --line:rgba(243,239,232,.13); --hair:rgba(243,239,232,.08); --soft:rgba(243,239,232,.04); --soft2:rgba(243,239,232,.08); --soft3:rgba(243,239,232,.1);
    --side-bg:#11100e; --nav-fg:#9a948a; --hero-bg:#0f0e0c; --veil-in:transparent; --veil-out:rgba(16,15,13,.92);
    --hs-filter:blur(3px) brightness(.42) saturate(1.1); --hb-filter:blur(2px) brightness(.55);
    --btn-line:rgba(243,239,232,.35); --btn-bg:rgba(22,21,19,.5); --inv-bg:#f3efe8; --inv-fg:#161513;
    --light-bg:#f3f1ec; --panel:#ebe8e1; --panel2:#ebe8e1;
    --accent:#6fa8f5; --accent-soft:rgba(111,168,245,.13); --accent-line:rgba(111,168,245,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;background:var(--black);color:var(--white);line-height:1.65;word-break:keep-all;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .ac{color:var(--accent)}
  b{font-weight:700}

  /* ===== SIDEBAR (유지) ===== */
  aside{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--side-bg);color:var(--white);padding:40px 32px;border-right:1px solid var(--hair);display:flex;flex-direction:column;z-index:20}
  .id small{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--g500)}
  .id h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
  .id p{font-size:14px;color:var(--g300)}
  .side-nav{margin-top:56px;list-style:none;display:flex;flex-direction:column;gap:2px}
  .side-nav a{display:flex;align-items:baseline;gap:14px;padding:10px 0;color:var(--nav-fg);font-weight:600;font-size:15px;transition:.2s;border-bottom:1px solid var(--line)}
  .side-nav a span{font-family:var(--mono);font-size:11px;width:20px}
  .side-nav a:hover,.side-nav a.on{color:var(--white)}
  .side-nav a.on span{color:var(--signal)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
  .side-foot a.dl{display:flex;justify-content:space-between;padding:12px 14px;border:1px solid var(--btn-line);border-radius:6px;font-weight:700;transition:.2s}
  .side-foot a.dl:hover{background:var(--inv-bg);color:var(--inv-fg)}
  .side-foot .mail{color:var(--g500);font-family:var(--mono);font-size:12px}

  main{margin-left:var(--side)}
  .inner{max-width:1180px;margin:0 auto;padding:0 40px}
  .eyebrow{font-size:13px;letter-spacing:.32em;color:var(--g300);text-transform:uppercase}

  /* 공통 버튼 */
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;font-size:15px;font-weight:700;border:1px solid var(--btn-line);transition:.2s;cursor:pointer;background:var(--btn-bg);color:var(--white);font-family:inherit}
  .btn:hover{border-color:var(--white)}
  .btn.primary{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
  .btn.primary:hover{background:var(--g100);color:var(--inv-fg)}
  .btn svg{width:16px;height:16px}

  /* 스크롤 표시 */
  .scroll{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--g500);padding:40px 0}
  .scroll i{width:22px;height:34px;border:1.5px solid var(--g500);border-radius:12px;position:relative}
  .scroll i::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--white);animation:wheel 1.6s infinite}
  @keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
  .light .scroll i{border-color:var(--ink3)} .light .scroll i::after{background:var(--ink)}

  /* ===== 01 HERO ===== */
  #about{position:relative}
  .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 24px 40px;overflow:hidden}
  .hero-bg{position:absolute;inset:0;background:
      radial-gradient(60% 50% at 30% 40%,rgba(96,165,250,.22),transparent 70%),
      radial-gradient(50% 45% at 72% 60%,rgba(255,91,46,.14),transparent 70%),
      radial-gradient(40% 40% at 55% 25%,rgba(10,49,99,.55),transparent 70%),var(--hero-bg);
      background-size:cover;background-position:center;filter:saturate(1.1)}
  .hero-bg.img{filter:var(--hb-filter)}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 65% at 50% 45%,var(--veil-in) 30%,var(--veil-out) 85%);pointer-events:none}
  .hero > *:not(.hero-bg):not(.hero-slides){position:relative;z-index:1}
  .hero-slides{position:absolute;inset:0;overflow:hidden}
  .hero-slides .hs{position:absolute;inset:-20px;background-size:cover;background-position:center;opacity:0;filter:var(--hs-filter);transform:scale(1.04);transition:opacity 1.6s ease,transform 7s linear}
  .hero-slides .hs.on{opacity:1;transform:scale(1.12)}
  .hero .eyebrow{margin-bottom:22px}
  .hero .sub{font-size:clamp(24px,3vw,36px);font-weight:600;letter-spacing:-.03em}
  .hero .sub b{color:var(--accent);font-weight:800}
  .hero h2{font-size:clamp(64px,9vw,112px);font-weight:900;letter-spacing:-.05em;line-height:1.1;margin:6px 0 26px}
  .hero .desc{font-size:17px;color:var(--g300);margin-bottom:26px}
  .hero .desc b{color:var(--white)}
  .pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
  .pills span{font-size:13px;padding:6px 16px;border-radius:999px;background:var(--soft2);border:1px solid var(--line);color:var(--g100)}

  /* ABOUT ME */
  .about{padding-top:80px;text-align:center}
  .about h3{font-size:clamp(30px,3.6vw,44px);font-weight:800;letter-spacing:-.04em;margin:14px 0 18px}
  .about h3 b{color:var(--accent)}
  .about .desc{color:var(--g300);font-size:16px;margin-bottom:48px}
  .about .desc b{color:var(--white)}
  .tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 20px;text-align:left;margin-bottom:40px}
  .tl-step{position:relative;padding-top:28px}
  .tl-step::before{content:"";position:absolute;top:6px;left:0;right:-20px;height:1px;background:var(--line)}
  .tl-step:last-child::before{right:0}
  .tl-step::after{content:"";position:absolute;top:1px;left:0;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--g300);background:var(--black)}
  .tl-step.now::before{background:var(--accent);height:2px}
  .tl-step.now::after{background:var(--accent);border-color:var(--accent)}
  .tl-step small{font-size:13px;color:var(--g500)}
  .tl-step h4{font-size:22px;font-weight:800;margin:4px 0}
  .tl-step p{font-size:13px;color:var(--g300);margin-bottom:10px}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .about-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;text-align:left}
  .acard{background:var(--dark);border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px}
  .acard .big{font-family:var(--mono);font-size:clamp(28px,2.8vw,40px);font-weight:700;color:var(--accent);letter-spacing:-.04em;line-height:1.1}
  .acard .big small{white-space:nowrap;font-size:14px;color:var(--g500);font-family:"Pretendard Variable",Pretendard,sans-serif;font-weight:500;margin-left:6px;letter-spacing:0}
  .acard h5{font-size:20px;font-weight:800;margin:18px 0 4px}
  .acard .lead{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:14px}
  .acard ul{list-style:none;display:grid;gap:6px}
  .acard li{font-size:14px;color:var(--g300);padding-left:14px;position:relative}
  .acard li::before{content:"";position:absolute;left:0;top:10px;width:4px;height:4px;border-radius:50%;background:var(--g500)}
  .acard li b{color:var(--white)}

  /* ===== 02 RESUME (밝은 섹션) ===== */
  .light{background:var(--light-bg);color:var(--ink)}
  #resume{padding:110px 0 20px}
  .resume{display:grid;grid-template-columns:260px 1fr;gap:44px}
  .pcard{background:var(--panel);border-radius:var(--radius);padding:30px 26px;align-self:start}
  .pcard h3{font-size:24px;font-weight:800;color:var(--accent-l);border-left:3px solid var(--accent-l);padding-left:10px;line-height:1.1;margin-bottom:26px}
  .pcard .photo{width:100%;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:#ddd;margin-bottom:26px}
  .pcard .photo img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
  .pcard .nm{font-size:20px;font-weight:800;letter-spacing:.3em}
  .pcard .en{color:var(--ink2);font-size:15px}
  .pcard .bd{color:var(--ink2);font-size:15px;margin-bottom:26px}
  .pcard .ml{font-size:15px}
  .pcard .ml span{color:var(--accent-l);margin-right:10px}
  .pcol{align-self:start;display:flex;flex-direction:column}
  .philo-btn{position:relative;margin-top:22px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:16px 20px;border:0;border-radius:16px;background:var(--accent);color:#fff;text-align:left;cursor:pointer;font-family:inherit;box-shadow:0 12px 26px -12px rgba(37,99,235,.65);transition:transform .25s,box-shadow .25s,background .2s;animation:philoBob 2.6s ease-in-out infinite}
  .philo-btn::before{content:"";position:absolute;left:34px;top:-11px;border:11px solid transparent;border-top:0;border-bottom-color:var(--accent);transition:border-color .2s}
  .philo-btn small{grid-column:1;font:600 10px/1 var(--mono);letter-spacing:.24em;color:rgba(255,255,255,.7)}
  .philo-btn b{grid-column:1;font-size:17px;font-weight:800;letter-spacing:-.02em}
  .philo-btn i{grid-column:2;grid-row:1/3;font-style:normal;font-size:18px;transition:transform .25s}
  .philo-btn:hover{animation:none;transform:translateY(-3px);background:#1d4ed8;box-shadow:0 16px 30px -12px rgba(37,99,235,.75)}
  .philo-btn:hover::before{border-bottom-color:#1d4ed8}
  .philo-btn:hover i{transform:translate(2px,-2px)}
  @keyframes philoBob{50%{transform:translateY(-4px)}}
  @media(prefers-reduced-motion:reduce){ .philo-btn{animation:none} }
  .ph-top h3{font-size:clamp(26px,3vw,38px)}
  .ph-top .m-sum b{color:var(--white)}
  .ph-body{padding:12px 36px 44px;max-width:860px}
  .ph-item{display:grid;grid-template-columns:64px 1fr;gap:4px 18px;padding:28px 0;border-bottom:1px solid var(--line)}
  .ph-no{font:700 13px/1.9 var(--mono);color:var(--accent-l);letter-spacing:.06em}
  .ph-item h4{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:10px;color:var(--white)}
  .ph-item p{font-size:15px;line-height:1.85;color:var(--g300)}
  .ph-item .ph-p2{margin-top:12px}
  .ph-item .ph-ex{margin-top:12px;padding:12px 16px;border-left:3px solid var(--accent-l);background:var(--panel);border-radius:0 8px 8px 0;font-size:14px}
  .ph-gal{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
  .ph-gal figure{margin:0}
  .ph-gal button{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;background:#111}
  .ph-gal img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;transition:transform .4s}
  .ph-gal button:hover img{transform:scale(1.04)}
  .ph-gal figcaption{margin-top:7px;font-size:13px;color:var(--ink3);text-align:center}
  .ph-outro{margin-top:34px;font-size:clamp(19px,2.2vw,24px);font-weight:800;letter-spacing:-.03em;color:var(--white)}
  .ph-outro b{color:var(--accent-l)}
  @media(max-width:700px){ .ph-body{padding:4px 20px 32px} .ph-item{grid-template-columns:1fr} }

  .rg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px 48px}
  .rg h4{font-size:17px;font-weight:800;color:var(--accent-l);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
  .rg h4 small{font-size:12px;color:var(--ink3);font-weight:500;margin-left:6px}
  .rg h4 .more-btn{font-size:12px;font-weight:600;color:var(--ink);border:1px solid var(--rule);padding:3px 12px;border-radius:999px;background:var(--light-bg);cursor:pointer;font-family:inherit}
  .rsec{padding-bottom:28px;border-bottom:1px solid var(--rule)}
  .stats{display:flex;gap:0;margin-bottom:22px}
  .stats div{padding-right:28px}
  .stats div+div{padding-left:28px;border-left:1px solid var(--rule)}
  .stats small{display:block;font-size:12px;color:var(--ink3)}
  .stats b{font-size:26px;font-weight:800;letter-spacing:-.03em}
  .stats div:first-child b{color:var(--accent-l)}
  .crow{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:14px;padding:4px 0}
  .crow .co{font-weight:600}
  .crow .tm{color:var(--ink2)}
  .crow ul{grid-column:2;list-style:none;margin:4px 0 0;display:grid;gap:3px}
  .crow li{font-size:13px;color:var(--ink2);padding-left:12px;position:relative}
  .crow li::before{content:"-";position:absolute;left:0;color:var(--ink3)}
  .prow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;font-size:14px;padding:5px 0}
  .prow .y{font-weight:800}
  .prow .r{color:var(--ink2)}
  .cdetail{grid-column:1/-1;padding:24px 26px;background:var(--panel);border-radius:var(--radius)}
  .cdetail h4{font-size:17px;font-weight:800;color:var(--accent-l);margin-bottom:18px}
  .cd-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
  .cd-lab{font-size:13px;font-weight:700;color:var(--ink3);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
  .cd-g{margin-bottom:16px}
  .cd-g b{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
  .cd-g ul{list-style:none;display:grid;gap:4px}
  .cd-g li{font-size:13px;color:var(--ink2);padding-left:12px;position:relative;line-height:1.6}
  .cd-g li::before{content:"";position:absolute;left:0;top:.68em;width:4px;height:4px;border-radius:50%;background:var(--accent-l)}
  .rg3{grid-column:1/-1;display:grid;grid-template-columns:1fr;gap:12px}
  .egrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 32px}
  .egrid .erow{grid-template-columns:44px 1fr}
  .lrow{display:grid;grid-template-columns:64px minmax(0,360px) minmax(0,1fr);gap:16px;align-items:baseline;font-size:14px;padding:9px 0}
  .elist .lrow:first-child{border-top:none}
  .elist .lrow.ny:not(:first-child){margin-top:10px}
  .lrow .y{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .lrow .t{font-weight:600}
  .lrow .s{font-size:13px;color:var(--ink3)}
  .open .lrow.more{display:grid}
  .erow{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:14px;padding:6px 0}
  .erow .y{font-weight:800;color:var(--ink)}
  .erow .t{font-weight:600}
  .erow .s{display:block;font-size:12px;color:var(--ink3);font-weight:400}
  .erow .s.wh{color:var(--accent-l);font-weight:600;font-variant-numeric:tabular-nums}
  .erow.more{display:none}
  .open .erow.more{display:grid}
  .rsec.col{border-bottom:none;padding-bottom:16px}

  /* ===== 03 WORKS ===== */
  #works{padding:100px 0 0}
  .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:44px}
  .tabs button{font-family:inherit;font-size:15px;font-weight:700;padding:10px 24px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--white);cursor:pointer;transition:.2s}
  .tabs button.on{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
  .wgroup{max-width:1500px;margin:0 auto 26px;padding:0 24px}
  .wgroup small{display:block;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .wg-row{display:flex;align-items:baseline;gap:10px}
  .wgroup h3{font-size:clamp(30px,3.6vw,44px);font-weight:800;letter-spacing:-.04em;line-height:1.1}
  .wgroup span{font-size:clamp(18px,2vw,26px);font-weight:700;color:var(--g500)}
  .works-grid + .wgroup{margin-top:80px}
  .works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding:0 24px;max-width:1500px;margin:0 auto}
  .wcard{background:var(--dark);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.25s}
  .wcard:hover{transform:translateY(-4px);border-color:var(--btn-line)}
  .wthumb{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .wbadge{position:absolute;top:12px;left:12px;z-index:1;padding:4px 10px;border-radius:999px;background:var(--signal);color:#fff;font-size:12px;font-weight:800;letter-spacing:.02em;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .wthumb img{width:100%;height:100%;object-fit:cover}
  .wthumb .ph{font-size:20px;font-weight:800;color:#fff;padding:20px;text-align:center;line-height:1.35;letter-spacing:-.02em}
  .wbody{padding:18px 18px 18px;display:flex;flex-direction:column;flex:1}
  .wmeta{font-size:12px;color:var(--g500);margin-bottom:8px}
  .wbody h5{font-size:17px;font-weight:800;line-height:1.35;margin-bottom:8px;letter-spacing:-.02em}
  .wbody p{font-size:13px;color:var(--g300);margin-bottom:14px;flex:1}
  .wtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
  .wtags span{font-size:11px;padding:3px 9px;border:1px solid var(--line);border-radius:5px;color:var(--g100)}
  .wlink{font-size:13px;font-weight:700;padding-top:14px;border-top:1px solid var(--line)}
  .wlink.soon{color:var(--g500)}
  .wcard a.wlink:hover{color:var(--accent)}

  /* ===== 작업 상세 팝업 ===== */
  .wcard{cursor:pointer}
  .wcard:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .wcard:hover .wlink{color:var(--accent)}
  dialog{border:0;padding:0;color:var(--white);background:transparent}
  dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
  body:has(dialog[open]){overflow:hidden}
  .modal{width:min(1120px,calc(100vw - 32px));max-height:calc(100vh - 48px);margin:auto;border-radius:18px;background:var(--dark);border:1px solid var(--line);overflow:hidden}
  .modal[open]{display:flex;flex-direction:column;animation:mIn .22s ease-out}
  @keyframes mIn{from{opacity:0;transform:translateY(12px)}}
  .m-content{overflow-y:auto}
  .m-close{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:22px;line-height:1;cursor:pointer}
  .m-close:hover{background:#fff;color:#000}
  .m-head{min-height:200px;display:flex;align-items:flex-end;padding:28px 32px;background-size:cover;background-position:center}
  .m-kind{font-size:13px;color:inherit;opacity:.75;margin-bottom:4px}
  .m-head h3{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
  .m-banner{height:220px;background-size:cover;background-position:center 30%}
  .m-top{padding:24px 36px 26px;border-bottom:1px solid var(--line)}
  .m-kicker{font-size:12px;font-weight:600;color:var(--g500);margin-bottom:6px}
  .m-top h3{font-size:clamp(26px,3vw,36px);font-weight:800;letter-spacing:-.04em;line-height:1.2;margin-bottom:10px}
  .m-sum{font-size:15px;color:var(--g300);line-height:1.7;max-width:760px;margin-bottom:18px}
  .m-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--soft)}
  .m-bar div{padding:12px 16px;min-width:0}
  .m-bar div + div{border-left:1px solid var(--line)}
  .m-bar dt{font-size:11px;color:var(--g500);margin-bottom:3px}
  .m-bar dd{font-size:14px;font-weight:700;color:var(--white);word-break:keep-all}
  .m-layout{display:grid;grid-template-columns:180px minmax(0,1fr)}
  .m-layout:not(:has(.m-toc)){grid-template-columns:1fr}
  .m-toc{position:sticky;top:0;align-self:start;display:flex;flex-direction:column;gap:2px;padding:28px 0 28px 28px}
  .m-toc small{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--g500);margin-bottom:8px}
  .m-toc a{font-size:13px;font-weight:600;color:var(--g500);padding:7px 0 7px 12px;border-left:2px solid var(--line);transition:.15s;line-height:1.35}
  .m-toc a:hover{color:var(--white)}
  .m-toc a.on{color:var(--white);border-left-color:var(--accent)}
  .m-toc a.grp em{font-style:normal;font-size:11px;color:var(--g500);margin-left:6px}
  .m-toc a.sub{display:none;padding-left:24px;font-size:12px;font-weight:500}
  .m-toc.open a.sub{display:block}
  .m-anchor{scroll-margin-top:16px;display:grid;gap:22px}
  .m-video{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
  .m-video iframe{width:100%;height:100%;border:0;display:block}
  .m-vcap{font-size:13px;color:var(--g500);margin-top:-10px}
  .m-vcap a{color:var(--accent);font-weight:600;margin-left:4px}
  .m-body{padding:28px 36px 40px;display:grid;gap:30px;min-width:0}
  .m-intro{font-size:15px;color:var(--g300)}
  .m-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .m-gallery figure{margin:0}
  .m-gallery figure:last-child:nth-child(odd){grid-column:1/-1}
  .m-gallery .g-img{display:block;width:100%;aspect-ratio:16/9;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--dark-2);cursor:zoom-in}
  .m-gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
  .m-gallery .g-img:hover img{transform:scale(1.03)}
  .sec-gal{margin-top:16px}
  .sec-links{margin-top:16px}
  .sec-gal .g-img{aspect-ratio:auto;background:#111}
  .sec-gal img{height:auto}
  .m-gallery figcaption{font-size:13px;color:var(--g300);margin-top:8px;text-align:center}
  .m-meta{display:grid;grid-template-columns:auto 1fr;gap:8px 24px;font-size:15px;padding:18px 20px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
  .m-meta dt{color:var(--g500)}
  .m-stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
  .m-stats > :only-child{grid-column:1/-1}
  .m-card{padding:20px;border-radius:12px;background:var(--dark-2);border:1px solid var(--line)}
  .m-card h4,.m-sec h4{font-size:16px;font-weight:800;margin-bottom:10px;color:var(--white)}
  .m-card ul{list-style:none;display:grid;gap:6px}
  .m-card li{font-size:14px;color:var(--g100);padding-left:14px;position:relative}
  .m-card li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .contrib{display:flex;gap:18px;align-items:center}
  .donut{--p:50;flex-shrink:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--soft3) 0);display:grid;place-items:center;position:relative}
  .donut::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--dark-2)}
  .donut span{position:relative;font-size:11px;color:var(--g300);text-align:center;line-height:1.2}
  .donut b{display:block;font-size:22px;color:var(--white)}
  .donut small{font-size:12px}
  .m-sec p{font-size:15px;color:var(--g300);line-height:1.8}
  .m-more{margin-top:12px}
  .m-more summary{list-style:none;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--g100);cursor:pointer;user-select:none}
  .m-more summary::-webkit-details-marker{display:none}
  .m-more summary:hover{border-color:var(--accent)}
  .m-more summary i{position:relative;width:12px;height:12px}
  .m-more summary i::before,.m-more summary i::after{content:"";position:absolute;left:0;top:5px;width:12px;height:2px;background:var(--accent);transition:transform .2s}
  .m-more summary i::after{transform:rotate(90deg)}
  .m-more[open] summary i::after{transform:rotate(0)}
  .m-more summary small{font-size:12px;color:var(--g500);font-weight:500}
  .mm-g{margin-top:14px}
  .mm-g b{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:8px;color:var(--white)}
  .mm-g b em{font-style:normal;font-size:11px;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:999px}
  .mm-g div{display:flex;flex-wrap:wrap;gap:6px}
  .mm-g span{font-size:12px;font-variant-numeric:tabular-nums;padding:3px 9px;border-radius:6px;background:var(--dark-2);border:1px solid var(--line);color:var(--g100)}
  .m-links{display:grid;gap:10px}
  .m-link{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center;padding:12px;border-radius:12px;background:var(--dark-2);border:1px solid var(--line);transition:border-color .2s}
  .m-link:hover{border-color:var(--accent)}
  .m-link .lt{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000}
  .m-link .lt img{width:100%;height:100%;object-fit:cover;display:block}
  .m-link .lt i{position:absolute;inset:0;margin:auto;width:40px;height:28px;border-radius:8px;background:#f00;color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
  .m-link b{display:block;font-size:15px;margin-bottom:4px}
  .m-link small{display:block;font-size:13px;color:var(--g300);margin-bottom:6px}
  .m-link em{font-style:normal;font-size:13px;font-weight:700;color:var(--accent)}
  @media(max-width:700px){ .m-link{grid-template-columns:1fr} }
  .doc-chap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
  .doc-chap button{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--dark-2);color:var(--white);font-family:inherit;font-size:14px;font-weight:600;text-align:left;cursor:pointer;transition:border-color .2s}
  .doc-chap button:hover{border-color:var(--accent)}
  .doc-chap span{font-size:12px;color:var(--accent);font-weight:800}
  .doc-chap em{margin-left:auto;font-style:normal;font-size:12px;color:var(--g500);font-weight:500}
  @media(max-width:700px){ .doc-chap{grid-template-columns:1fr} }
  .doc-desc{font-size:14px;color:var(--g300);margin:-4px 0 12px}
  .doc-thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
  .doc-thumb{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#222;cursor:pointer;padding:0;color:#fff;font-family:inherit;font-weight:700}
  .doc-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
  .doc-thumb:hover img{transform:scale(1.04)}
  .doc-thumb span{position:absolute;right:6px;bottom:6px;font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.6)}
  .doc-actions{display:flex;gap:8px;flex-wrap:wrap}
  .doc-empty{font-size:14px;color:var(--g500);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  .viewer{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;background:rgba(10,10,10,.96)}
  .viewer[open]{display:flex;flex-direction:column}
  .v-bar{position:relative;display:flex;align-items:center;justify-content:center;padding:14px 64px;border-bottom:1px solid var(--line)}
  .v-bar .m-close{top:8px}
  .v-title{font-size:15px;font-weight:700}
  .v-zoom{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px}
  .v-zoom button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:18px;line-height:1;cursor:pointer;font-family:inherit}
  .v-zoom button:hover{background:#fff;color:#000}
  .v-zoom button:disabled{opacity:.35;pointer-events:none}
  .v-zv{min-width:52px;text-align:center;font-size:13px;font-weight:700;color:var(--g100);font-variant-numeric:tabular-nums}
  .v-pages{--z:1;overflow:auto;flex:1;display:flex;flex-direction:column;align-items:safe center;gap:16px;padding:24px 16px 60px}
  .v-cap{width:calc(min(1100px,100%) * var(--z));max-width:100%;flex-shrink:0;margin:-6px 0 20px;font-size:15px;line-height:1.5;color:var(--g100);text-align:center;word-break:keep-all}
  .v-pages img{width:calc(min(1100px,100%) * var(--z));max-width:none;flex-shrink:0;height:auto;border-radius:4px;background:#222;scroll-margin-top:16px}
  @media(max-width:700px){ .m-gallery{grid-template-columns:1fr} .m-stats{grid-template-columns:1fr} .doc-thumbs{grid-template-columns:repeat(2,1fr)} .m-head h3{font-size:24px} .m-body,.m-head,.m-top{padding-left:20px;padding-right:20px} .m-banner{height:150px} .m-bar{grid-template-columns:1fr 1fr} .m-bar div:nth-child(3){border-left:0} .m-bar div:nth-child(n+3){border-top:1px solid var(--line)} .m-layout{grid-template-columns:1fr} .m-toc{display:none} }

  /* ===== SKILLS ===== */
  #skills{padding:110px 0 0}
  .skills{text-align:center}
  .skills h3{font-size:clamp(28px,3.4vw,42px);font-weight:800;letter-spacing:-.04em;line-height:1.3;margin:14px 0 52px}
  .skills h3 b{color:var(--accent)}
  .skills h3.sk-title{font-size:clamp(30px,3.6vw,44px);margin:14px 0 18px}
  .skills .sk-desc{color:var(--g300);font-size:16px;margin-bottom:52px}
  .skills .sk-desc b{color:var(--white)}
  .sk-group{text-align:left;margin-bottom:40px}
  .sk-gname{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;margin-bottom:16px}
  .sk-gname span{font-size:12px;font-weight:800;color:var(--accent);padding:2px 8px;border:1px solid var(--accent-line);border-radius:999px}
  .sk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .sk-grid.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sk-grid.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sk-card{background:var(--dark);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 24px}
  .sk-card{display:flex;flex-direction:column}
  .sk-img{position:relative;display:block;width:calc(100% + 44px);margin:-22px -22px 18px;aspect-ratio:16/9;padding:0;border:0;border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;overflow:hidden;background:var(--dark-2);cursor:zoom-in}
  .sk-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
  .sk-img:hover img{transform:scale(1.04)}
  .sk-grid.n2 .sk-img{aspect-ratio:2/1}
  .sk-img.fit img{object-fit:contain}
  .sk-cnt{position:absolute;right:10px;bottom:10px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.7);color:#fff}
  .sk-blur{position:absolute;left:10px;bottom:10px;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.65);color:#e8e8e8}
  .sk-pts{list-style:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:5px}
  .sk-pts li{font-size:13px;color:var(--g100);padding-left:12px;position:relative}
  .sk-pts li::before{content:"";position:absolute;left:0;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--accent)}
  .sk-vid{margin-top:12px;font-size:13px;font-weight:700;color:var(--accent)}
  .sk-card svg{width:30px;height:30px;color:var(--accent);margin-bottom:14px}
  .sk-card h5{font-size:17px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
  .sk-card h5 em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
  .tl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px}
  .tl-card h5{margin-bottom:16px}
  .tl-icons{display:flex;flex-wrap:wrap;gap:14px}
  .tool{display:flex;flex-direction:column;align-items:center;gap:8px}
  .tool i{width:60px;height:60px;border-radius:14px;background:#f2f2f2;display:flex;align-items:center;justify-content:center}
  .tool img{width:38px;height:38px;object-fit:contain}
  .tool b{font-size:13px;font-weight:800;color:var(--accent)}
  @media(max-width:900px){ .tl-grid{grid-template-columns:1fr} }
  .sk-card p{font-size:14px;color:var(--g300);line-height:1.7}
  @media(max-width:1100px){ .sk-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media(max-width:640px){ .sk-grid,.sk-grid.n2,.sk-grid.n3{grid-template-columns:1fr} }

  /* ===== PLAY ===== */
  #play{padding:120px 0 20px}
  .play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:56px;align-items:center}
  .eyebrow.dk{color:var(--accent-l)}
  .play h3{font-size:clamp(30px,3.2vw,40px);font-weight:800;letter-spacing:-.04em;line-height:1.3;margin:14px 0 36px}
  .play h3 b{color:var(--accent-l)}
  .play-lead{margin:-18px 0 34px;font-size:15px;line-height:1.8;color:var(--ink3)}
  .play ol{list-style:none;display:grid;gap:18px}
  .play li{display:grid;grid-template-columns:36px 1fr;font-size:15px;color:var(--ink2)}
  .play li span{font-weight:800;color:var(--accent-l)}
  .play li b{color:var(--accent-l)}
  .play-panel{background:var(--panel);border-radius:var(--radius);padding:24px}
  .play-panel .cap{font-size:13px;color:var(--ink3);margin-bottom:16px}
  .games{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
  .game{position:relative}
  .gi{aspect-ratio:1/1;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .gi img{width:100%;height:100%;object-fit:cover}
  .gi span{color:#fff;font-size:12px;font-weight:700;text-align:center;padding:8px;line-height:1.3}
  .game.has-note{cursor:pointer}
  .gnote{position:absolute;inset:0;border-radius:16px;background:rgba(17,17,17,.78);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
  .game.show-note .gnote{opacity:1}
  .game.has-detail{cursor:pointer}
  .game.has-detail .gi::after{content:"i";position:absolute;right:6px;bottom:6px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:800;font-style:italic;display:flex;align-items:center;justify-content:center}
  .game .gi{position:relative}
  .game.sel .gi{outline:3px solid var(--accent-l);outline-offset:2px}
  .play-panel{position:relative}
  .gpop{position:absolute;z-index:30;width:300px;max-width:calc(100% - 16px);padding:16px;border-radius:14px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;pointer-events:none}
  .gpop.on{opacity:1;transform:none;pointer-events:auto}
  .gpop::after{content:"";position:absolute;left:var(--ax,50%);bottom:-7px;width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
  .gpop.below::after{bottom:auto;top:-7px}
  .gpop h4{font-size:15px;font-weight:800;color:var(--ink);text-align:center;margin-bottom:12px}
  .gpop .gstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .gpop .gs{background:#f3f4f6;border-radius:10px;padding:10px 12px;min-width:0}
  .gpop .gs.w{grid-column:1/-1}
  .gpop .gs small{display:block;font-size:11px;color:var(--ink3);margin-bottom:3px}
  .gpop .gs b{display:block;font-size:14px;font-weight:800;color:var(--ink);line-height:1.35;word-break:keep-all}
  .gpop .gs.w b{font-size:13px}
  .gpop .gmax{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;background:#e3edff;color:#2f6bff;font-size:10px;font-weight:800;font-style:normal;vertical-align:2px;letter-spacing:.02em}
  .dnote{margin-top:10px}
  .dmark{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#555;color:#fff;font-size:11px;font-weight:800;font-style:italic;align-items:center;justify-content:center;margin-right:8px;vertical-align:middle}
  .gbadge{position:absolute;top:-6px;left:-6px;height:20px;padding:0 7px;border-radius:999px;background:#ff5b2e;color:#fff;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #f5f5f5,0 1px 3px rgba(0,0,0,.25)}
  .game.show-note .gbadge{opacity:0}
  .star{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:#ffc53d;color:#fff;font-style:normal;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .star.s{position:static;display:inline-flex;width:20px;height:20px;font-size:11px;margin-right:8px;vertical-align:middle}
  .note{margin-top:18px;font-size:13px;color:var(--ink3)}
  .note b{color:var(--ink)}

  /* ===== 05 GAME LIFE ===== */
  .fan-sec{background:var(--panel2);padding:120px 0 20px}
  .fan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:76px;grid-auto-flow:dense;gap:12px}
  .fan-grid figure{margin:0;display:flex;flex-direction:column;min-height:0;grid-row:span 2}
  .fan-grid figure.wide{grid-column:span 2;grid-row:span 3}
  .fan-grid figure.tall{grid-row:span 5}

<!--
  ===========================================================
  내용 수정은 아래 <script> 안의 DATA 부분만 고치면 됩니다.
  - 썸네일: assets/thumbs 폴더에 넣고 thumb: "assets/thumbs/파일명.png"
  - 기획서 PDF: assets/docs 폴더에 넣고 link: "assets/docs/파일명.pdf"
  - 첫 화면 배경 이미지: heroBg: "assets/hero.jpg" (비우면 그라데이션)
  - link가 비어 있으면 '준비 중'으로 표시됩니다.

<div class="intro" id="intro" role="button" tabindex="0" aria-label="포트폴리오 들어가기">
  <p class="l1"><b>핵심 플레이 경험</b>을 중시하는 디자이너</p>
  <p class="l2"><b>손지윤</b>입니다</p>
  <small>CLICK TO ENTER</small>
</div>
<script>
(() => {
  const el = document.getElementById("intro");
  let seen = false; try { seen = sessionStorage.getItem("intro_seen") === "1"; } catch (e) {}
  if (seen) { el.remove(); return; }
  document.body.classList.add("intro-on");
  const enter = () => {
    if (el.classList.contains("out")) return;
    el.classList.add("out"); document.body.classList.remove("intro-on");
    try { sessionStorage.setItem("intro_seen", "1"); } catch (e) {}
    setTimeout(() => el.remove(), 800);
  };
  el.addEventListener("click", enter);
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") enter(); });
  window.addEventListener("wheel", enter, { once: true, passive: true });
  window.addEventListener("touchmove", enter, { once: true, passive: true });

(() => {
  const h = document.getElementById("showcase"); if (!h) return;
  let played = false; try { played = sessionStorage.getItem("hero_played") === "1"; } catch (e) {}
  if (played || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  h.classList.add("pre");
  const go = () => {
    requestAnimationFrame(() => requestAnimationFrame(() => h.classList.add("play")));
    try { sessionStorage.setItem("hero_played", "1"); } catch (e) {}
    setTimeout(() => h.classList.remove("pre", "play"), 2800);
  };
  if (document.body.classList.contains("intro-on")) {
    const mo = new MutationObserver(() => { if (!document.body.classList.contains("intro-on")) { mo.disconnect(); setTimeout(go, 200); } });
    mo.observe(document.body, { attributes: true, attributeFilter: ["class"] });
  } else go();
})();

(() => {
  const scene = document.getElementById("qscene"), card = document.getElementById("qcard");
  const fit = () => {
    const EH = Math.round(Math.min(400, scene.offsetWidth * 0.58));
    scene.style.setProperty("--EH", EH + "px");
    const ch = card.offsetHeight, cb = Math.round(EH * 0.43);
    card.style.setProperty("--cb", cb + "px");
    scene.style.height = EH + Math.max(0, ch - (EH - cb)) + 16 + "px";
    card.style.setProperty("--hide", (ch - (EH - cb) + 20) + "px");
  };
  addEventListener("resize", fit); fit();
  if (document.fonts) document.fonts.ready.then(fit);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) { scene.classList.add("open"); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { scene.classList.add("open"); io.disconnect(); } }), { threshold: .45 });
  io.observe(scene);
})();

const ZOOMS = [0.5, 0.75, 1, 1.25, 1.5, 2];
let zoomIdx = 2;
function setZoom(z) {
  const box = document.querySelector("#doc-viewer .v-pages");
  const imgs = [...box.querySelectorAll("img")];
  const keep = imgs.find(im => im.offsetTop + im.offsetHeight > box.scrollTop + 10);
  const ratio = keep ? (box.scrollTop - keep.offsetTop) / Math.max(keep.offsetHeight, 1) : 0;
  zoomIdx = ZOOMS.indexOf(z) >= 0 ? ZOOMS.indexOf(z) : 2;
  box.style.setProperty("--z", ZOOMS[zoomIdx]);
  document.querySelector("#doc-viewer .v-zv").textContent = Math.round(ZOOMS[zoomIdx] * 100) + "%";
  document.querySelectorAll("#doc-viewer .v-zoom button").forEach(b => b.disabled = (b.dataset.z < 0 && zoomIdx === 0) || (b.dataset.z > 0 && zoomIdx === ZOOMS.length - 1));
  if (keep) { box.scrollTop = keep.offsetTop + ratio * keep.offsetHeight; box.scrollLeft = (box.scrollWidth - box.clientWidth) / 2; }
}
document.querySelectorAll("#doc-viewer .v-zoom button").forEach(b => b.onclick = () => setZoom(ZOOMS[Math.min(ZOOMS.length - 1, Math.max(0, zoomIdx + +b.dataset.z))]));

(() => {
  const pop = document.getElementById("gpop"), panel = pop.parentElement; let cur = null;
  const hide = () => { pop.classList.remove("on"); pop.setAttribute("aria-hidden", "true"); cur && cur.classList.remove("sel"); cur = null; };
  const place = () => {
    if (!cur) return;
    const pr = panel.getBoundingClientRect(), r = cur.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight, cx = r.left + r.width / 2 - pr.left;
    const left = Math.max(8, Math.min(pr.width - w - 8, cx - w / 2));
    const below = r.top - h - 12 < 8;
    pop.classList.toggle("below", below);
    pop.style.left = left + "px";
    pop.style.top = (below ? r.bottom - pr.top + 12 : r.top - pr.top - h - 12) + "px";
    pop.style.setProperty("--ax", Math.max(18, Math.min(w - 18, cx - left)) + "px");
  };
  document.querySelectorAll(".game.has-detail").forEach(el => {
    const show = e => {
      e && e.stopPropagation();
      if (cur === el) return hide();
      hide();
      const g = DATA.play.games[+el.dataset.gi];
      pop.innerHTML = `<h4>${g.name}</h4><div class="gstats">${g.detail.map(d => Array.isArray(d)

      cur = el; el.classList.add("sel"); place();
      pop.classList.add("on"); pop.setAttribute("aria-hidden", "false");

  });
  pop.onclick = e => e.stopPropagation();
  document.addEventListener("click", hide);

  window.addEventListener("resize", place);

})();

  try { await navigator.clipboard.writeText(b.dataset.v); toast("복사했습니다"); } catch { toast(b.dataset.v); }
});

const links = document.querySelectorAll(".side-nav a");
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll("main > section").forEach(s => io.observe(s));
</script>
<script>
(() => {
  const b = document.getElementById("themeBtn"), root = document.documentElement;
  const sync = () => { b.querySelector("span").textContent = root.dataset.theme === "dark" ? "밝게 보기" : "어둡게 보기"; };
  b.onclick = () => {
    if (root.dataset.theme === "dark") delete root.dataset.theme; else root.dataset.theme = "dark";
    try { localStorage.setItem("theme", root.dataset.theme === "dark" ? "dark" : "light"); } catch (e) {}
    sync();
  };
  sync();
})();

// 스크롤 등장 애니메이션 (요소마다 처음 한 번만)
(() => {
  if (!("IntersectionObserver" in window)) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const sel = "#resume .pcard, #resume .philo-btn, #resume .rsec > h4, #resume .stats, #resume .crow, #resume .prow, #resume .egrid > :not(.more), #resume .elist > :not(.more), #works .tabs, .wgroup, .wcard, .skills > .eyebrow, .sk-title, .sk-desc, .sk-gname, .sk-grid > *, .tl-grid > *, .play-text > *, .play-panel > .cap, .play-panel > .note, .games > *, .fan-grid > *, #outro .eyebrow, .o-title, .o-vids > *, #contact > *:not(footer), main section > .scroll";
  const els = [...document.querySelectorAll(sel)];
  const done = el => { el.classList.remove("rv", "in"); el.style.transitionDelay = ""; };
  const io = new IntersectionObserver(entries => {
    let n = 0;
    entries.filter(e => e.isIntersecting).forEach(e => {
      const el = e.target; io.unobserve(el);
      el.style.transitionDelay = Math.min(n++, 5) * 90 + "ms";
      el.classList.add("in");
      el.addEventListener("transitionend", () => done(el), { once: true });
      setTimeout(() => done(el), 2000);
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
  els.forEach(el => { el.classList.add("rv"); io.observe(el); });
})();
</script>
<script>
try {
  const q = new URLSearchParams(location.search);
  if (q.has("me")) localStorage.setItem("hits_off", "1");
  if (q.has("notme")) localStorage.removeItem("hits_off");
  if (!localStorage.getItem("hits_off")) { const px = new Image(); px.referrerPolicy = "no-referrer"; px.src = "https://hits.sh/shjy1124.github.io/visitors.svg"; }
  else { const tag = document.createElement("div"); tag.textContent = "방문자 수 제외 중"; tag.style.cssText = "position:fixed;right:20px;bottom:66px;z-index:9999;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.6);color:#9ca3af;pointer-events:none"; document.body.appendChild(tag); }
} catch (e) {}
</script>
